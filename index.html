<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webcam Live</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
    #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
    #status[hidden] { display: none; }
    button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; cursor: pointer; }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">
    <p id="message">Requesting camera access…</p>
    <button id="retry" hidden>Try again</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const retry = document.getElementById('retry');

    async function start() {
      status.hidden = false;
      retry.hidden = true;
      message.textContent = 'Requesting camera access…';

      if (!navigator.mediaDevices?.getUserMedia) {
        message.textContent = 'This browser does not support camera access. Open this page via http://localhost or https.';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        status.hidden = true;
      } catch (err) {
        const reasons = {
          NotAllowedError: 'Camera permission was denied. Allow it in your browser (and in System Settings → Privacy & Security → Camera), then try again.',
          NotFoundError: 'No camera was found.',
          NotReadableError: 'The camera is in use by another app.'
        };
        message.textContent = reasons[err.name] || `Could not start the camera: ${err.message}`;
        retry.hidden = false;
      }
    }

    retry.addEventListener('click', start);
    start();
  </script>
</body>
</html>
