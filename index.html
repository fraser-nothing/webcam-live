<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Barber Shop Simulator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CclipPath id='c'%3E%3Crect x='22' y='12' width='20' height='40' rx='10'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path='url(%23c)'%3E%3Crect width='64' height='64' fill='%23fff'/%3E%3Cg transform='rotate(-35 32 32)'%3E%3Crect x='-20' y='-40' width='104' height='5' fill='%23c8352e'/%3E%3Crect x='-20' y='-30' width='104' height='5' fill='%232c4f8f'/%3E%3Crect x='-20' y='-20' width='104' height='5' fill='%23c8352e'/%3E%3Crect x='-20' y='-10' width='104' height='5' fill='%232c4f8f'/%3E%3Crect x='-20' y='0' width='104' height='5' fill='%23c8352e'/%3E%3Crect x='-20' y='10' width='104' height='5' fill='%232c4f8f'/%3E%3Crect x='-20' y='20' width='104' height='5' fill='%23c8352e'/%3E%3Crect x='-20' y='30' width='104' height='5' fill='%232c4f8f'/%3E%3Crect x='-20' y='40' width='104' height='5' fill='%23c8352e'/%3E%3Crect x='-20' y='50' width='104' height='5' fill='%232c4f8f'/%3E%3Crect x='-20' y='60' width='104' height='5' fill='%23c8352e'/%3E%3Crect x='-20' y='70' width='104' height='5' fill='%232c4f8f'/%3E%3Crect x='-20' y='80' width='104' height='5' fill='%23c8352e'/%3E%3Crect x='-20' y='90' width='104' height='5' fill='%232c4f8f'/%3E%3C/g%3E%3C/g%3E%3Crect x='22' y='12' width='20' height='40' rx='10' fill='none' stroke='%237a5a24' stroke-width='2'/%3E%3Crect x='18' y='5' width='28' height='9' rx='4.5' fill='%23c9a25a'/%3E%3Crect x='18' y='50' width='28' height='9' rx='4.5' fill='%23c9a25a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --wall: #0f1412;
      --wall-2: #16201c;
      --cream: #f3ead8;
      --muted: #a79f8f;
      --brass: #c9a25a;
      --brass-hi: #f1d596;
      --brass-lo: #7a5a24;
      --red: #c8352e;
      --blue: #2c4f8f;
      --glass: #0b0d0d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; }
    body {
      color: var(--cream);
      font: 15px/1.4 "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      /* Dark tiled wall under a warm spotlight. */
      background:
        radial-gradient(ellipse 70% 55% at 50% 0%, rgba(241, 213, 150, .16), transparent 70%),
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 44px 22px,
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 44px 44px,
        linear-gradient(var(--wall-2), var(--wall));
      display: flex; flex-direction: column; align-items: center;
      padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
      gap: 14px;
    }
    video { display: none; }

    /* ---- Sign ---- */
    header { text-align: center; line-height: 1; }
    h1 { margin: 0; font: 400 clamp(34px, 5vw, 58px)/.9 "Bebas Neue", sans-serif; letter-spacing: .06em;
         color: var(--cream); text-shadow: 0 0 18px rgba(241, 213, 150, .35), 0 2px 0 rgba(0,0,0,.6); }
    h1 span { color: var(--brass-hi); }
    .tagline { margin-top: 6px; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
    .tagline::before, .tagline::after { content: ""; display: inline-block; width: 28px; height: 1px; background: var(--brass); vertical-align: middle; margin: 0 10px; }

    /* ---- Mirror, with barber poles either side ---- */
    .station { display: flex; align-items: center; justify-content: center; gap: 22px; flex: 1; min-height: 0; width: 100%; }
    .mirror {
      position: relative;
      width: min(1100px, 100%, calc((100dvh - 285px) * 4 / 3));
      aspect-ratio: 4 / 3;
      padding: 14px;
      border-radius: 30px;
      /* Polished brass frame. */
      background: linear-gradient(145deg, var(--brass-hi), var(--brass) 30%, var(--brass-lo) 55%, var(--brass) 75%, var(--brass-hi));
      box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4), inset 0 1px 1px rgba(255,255,255,.5);
    }
    .glass {
      position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 18px; background: var(--glass);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.6);
    }
    .glass canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .glass canvas#flagCanvas { transform: none; pointer-events: none; z-index: 4; }
    .mullet { font: 400 16px/1 "Bebas Neue", sans-serif; letter-spacing: .14em; color: var(--muted); background: none; padding: 4px 10px; }
    .mullet:hover { color: var(--brass-hi); }
    .mullet b { color: var(--red); font-weight: 400; }
    /* A soft glare across the glass and darker edges. */
    .glass::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background:
        linear-gradient(115deg, transparent 30%, rgba(255,255,255,.07) 38%, rgba(255,255,255,.02) 46%, transparent 52%),
        radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.35));
    }
    .pole { display: none; width: 30px; height: min(60%, 420px); position: relative; border-radius: 15px; overflow: hidden;
            background: repeating-linear-gradient(-45deg, var(--red) 0 16px, #fff 16px 32px, var(--blue) 32px 48px, #fff 48px 64px);
            background-size: 100% 90.5px; animation: spin 1.6s linear infinite;
            box-shadow: inset -6px 0 10px rgba(0,0,0,.35), inset 6px 0 8px rgba(255,255,255,.35), 0 0 0 4px var(--brass), 0 10px 24px rgba(0,0,0,.5); }
    @keyframes spin { to { background-position: 0 90.5px; } }
    @media (prefers-reduced-motion: reduce) { .pole { animation: none; } }
    @media (min-width: 1000px) { .pole { display: block; } }

    #status { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: var(--cream); }
    #status[hidden] { display: none; }
    #face { position: absolute; z-index: 6; top: 14px; left: 14px; font-size: 12px; letter-spacing: .04em; padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,.6); }

    /* ---- Buttons ---- */
    button { font: inherit; cursor: pointer; border: 0; color: inherit; }
    button:disabled { opacity: .6; cursor: default; }
    .chair { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .big {
      display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; border-radius: 999px; white-space: nowrap;
      font: 400 24px/1 "Bebas Neue", sans-serif; letter-spacing: .08em;
      color: #1b140a; background: linear-gradient(180deg, var(--brass-hi), var(--brass));
      box-shadow: 0 6px 0 var(--brass-lo), 0 10px 22px rgba(0,0,0,.45);
      transition: transform .08s, box-shadow .08s, filter .15s;
    }
    .big:hover { filter: brightness(1.06); }
    .big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brass-lo), 0 4px 10px rgba(0,0,0,.4); }
    .big svg { width: 22px; height: 22px; }
    .small { padding: 10px 18px; border-radius: 999px; background: rgba(243, 234, 216, .08); border: 1px solid rgba(243, 234, 216, .2); font-weight: 500; }
    .small:hover { background: rgba(243, 234, 216, .14); }
    #retry { padding: 10px 20px; border-radius: 999px; background: var(--brass); color: #1b140a; font-weight: 700; }

    /* ---- Pop-up panels (Dye, Extras) ---- */
    .extras { position: relative; }
    .extras.left .extras-panel { right: auto; left: 0; }
    .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 6px;
           border: 1px solid rgba(243, 234, 216, .5); background: conic-gradient(#2a1d15, #7a4a2a, #c9a25a, #2a1d15); }
    .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .swatch { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: none; padding: 0; }
    .swatch i { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(243, 234, 216, .25); box-shadow: inset 0 -6px 10px rgba(0,0,0,.35); }
    .swatch[aria-checked="true"] { color: var(--cream); }
    .swatch[aria-checked="true"] i { border-color: var(--brass-hi); box-shadow: 0 0 0 3px rgba(241, 213, 150, .35), inset 0 -6px 10px rgba(0,0,0,.35); }
    .custom { display: flex; align-items: center; justify-content: space-between; }
    .custom input[type=color] { width: 44px; height: 32px; padding: 0; border: 1px solid rgba(243, 234, 216, .3); border-radius: 8px; background: none; cursor: pointer; }
    .extras-panel {
      position: absolute; bottom: calc(100% + 10px); right: 0; z-index: 30; width: min(340px, calc(100vw - 32px));
      display: grid; gap: 12px; padding: 16px; border-radius: 16px; background: rgba(16, 20, 18, .96);
      border: 1px solid rgba(201, 162, 90, .5); box-shadow: 0 20px 40px rgba(0,0,0,.5); font-size: 14px;
    }
    .extras-panel[hidden] { display: none; }
    .extras-panel h2 { margin: 0; font: 400 20px/1 "Bebas Neue", sans-serif; letter-spacing: .08em; color: var(--brass-hi); }
    .extras-panel .row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .extras-panel label { display: flex; align-items: center; gap: 8px; }
    .extras-panel label.slider { justify-content: space-between; }
    .extras-panel input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brass); margin: 0; }
    .extras-panel input[type=range] { flex: 1; max-width: 190px; accent-color: var(--brass); }

    @media (max-width: 700px) {
      body { gap: 10px; padding-left: 10px; padding-right: 10px; }
      .tagline { display: none; }
      .mirror { aspect-ratio: 3 / 4; width: min(100%, calc((100dvh - 222px) * 3 / 4)); padding: 10px; border-radius: 24px; }
      .glass { border-radius: 16px; }
      .big { padding: 13px 14px; font-size: 19px; gap: 8px; flex: 1; justify-content: center; }
      .chair { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Barber Shop <span>Simulator</span></h1>
    <div class="tagline">Walk-ins welcome</div>
  </header>

  <div class="station">
    <div class="pole" aria-hidden="true"></div>
    <div class="mirror">
      <div class="glass">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <canvas id="hairCanvas"></canvas>
        <canvas id="flagCanvas"></canvas>
        <div id="face" hidden>Looking for faces…</div>
        <div id="status">
          <p id="message">Requesting camera access…</p>
          <button id="retry" hidden>Try again</button>
        </div>
      </div>
    </div>
    <div class="pole" aria-hidden="true"></div>
  </div>

  <div class="chair">
    <button id="growHair" class="big" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg>
      <span>Grow hair</span>
    </button>
    <button id="growBeard" class="big" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9c0 7 3.5 11 8 11s8-4 8-11"/><path d="M8 13c1.3-1 2.6-1.5 4-1.5s2.7.5 4 1.5"/></svg>
      <span>Grow beard</span>
    </button>
    <button id="resetHair" class="small" type="button" hidden>Cut hair</button>
    <button id="shaveBeard" class="small" type="button" hidden>Shave</button>
    <div class="extras left">
      <button id="dyeToggle" class="small" type="button" aria-expanded="false" aria-controls="dye"><span id="dyeDot" class="dot"></span>Dye</button>
      <div id="dye" class="extras-panel" hidden>
        <h2>Hair dye</h2>
        <div id="swatches" class="swatches" role="radiogroup" aria-label="Hair colour"></div>
        <label class="custom">Custom colour <input id="dyeCustom" type="color" value="#8a3fd1"></label>
      </div>
    </div>
    <div class="extras">
      <button id="extrasToggle" class="small" type="button" aria-expanded="false" aria-controls="extras">Extras</button>
      <div id="extras" class="extras-panel" hidden>
        <h2>Face pulse</h2>
        <div class="row">
          <label><input id="pulseEyes" type="checkbox"> Eyes</label>
          <label><input id="pulseNose" type="checkbox"> Nose</label>
          <label><input id="pulseMouth" type="checkbox"> Mouth</label>
        </div>
        <label class="slider">Speed <input id="speed" type="range" min="0.2" max="4" step="0.1" value="1.2"></label>
        <label class="slider">Size <input id="amount" type="range" min="0" max="1" step="0.01" value="0.6"></label>
        <h2>Eyebrows</h2>
        <label><input id="browWobble" type="checkbox"> Eyebrow wave</label>
        <label class="slider">Wave speed <input id="waveSpeed" type="range" min="0.05" max="1.5" step="0.05" value="0.35"></label>
      </div>
    </div>
  </div>

  <button id="mulletMe" class="mullet" type="button"><b>★</b> Mullet Me <b>★</b></button>

  <script type="module">
    import { FaceLandmarker, ImageSegmenter, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';

    const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm';
    const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
    // Segments each pixel into background, hair, body skin, face skin, clothes, other.
    const SEGMENT_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite';
    const HAIR_CATEGORY = 1, BODY_SKIN = 2, FACE_SKIN = 3, CLOTHES = 4;

    const $ = id => document.getElementById(id);
    const video = $('video'), canvas = $('canvas'), hairCanvas = $('hairCanvas');
    const status = $('status'), message = $('message'), retry = $('retry'), faceBadge = $('face');
    const speed = $('speed'), amount = $('amount');
    const pulseEyes = $('pulseEyes'), pulseNose = $('pulseNose'), pulseMouth = $('pulseMouth');
    const browWobble = $('browWobble'), waveSpeed = $('waveSpeed'), growHair = $('growHair'), resetHair = $('resetHair');
    const growBeard = $('growBeard'), shaveBeard = $('shaveBeard');

    // Phones get a lighter load: fewer people, fewer hair strands and a smaller camera feed.
    const MOBILE = matchMedia('(max-width: 700px), (pointer: coarse)').matches;
    const MAX_FACES = MOBILE ? 3 : 4; // the shader's arrays are sized for 4

    // The Dye and Extras pop-up panels: one open at a time, closed by clicking elsewhere.
    const panels = [[$('dyeToggle'), $('dye')], [$('extrasToggle'), $('extras')]];
    const showPanel = (panel, open) => {
      panel.hidden = !open;
      panels.find(([, p]) => p === panel)[0].setAttribute('aria-expanded', String(open));
    };
    for (const [toggle, panel] of panels) {
      toggle.addEventListener('click', () => {
        const open = panel.hidden;
        for (const [, p] of panels) showPanel(p, false);
        showPanel(panel, open);
      });
    }
    document.addEventListener('click', e => {
      for (const [toggle, panel] of panels) {
        if (!panel.hidden && !panel.contains(e.target) && !toggle.contains(e.target)) showPanel(panel, false);
      }
    });

    // Browsers restore form state on reload; always start from the defaults in the HTML.
    for (const input of document.querySelectorAll('#extras input')) {
      input.checked = input.defaultChecked;
      input.value = input.defaultValue;
    }

    // Landmark indices from MediaPipe's 478-point face mesh.
    const EYES = [
      { centre: [468, 468], width: [33, 133], size: 1.1 },
      { centre: [473, 473], width: [362, 263], size: 1.1 }
    ];
    const NOSE = { centre: [1, 4], width: [129, 358], size: 1.0 };
    const MOUTH = { centre: [13, 14], width: [61, 291], size: 0.8 };
    // Each brow as [upper, lower] landmark pairs at its outer end, arch and inner end.
    const BROWS = [
      { outer: [70, 46], mid: [105, 52], inner: [107, 55] },
      { outer: [300, 276], mid: [334, 282], inner: [336, 285] }
    ];
    const FACE_OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377,
                       152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
    const FOREHEAD = 10, CHIN = 152;

    // ---------- WebGL: draw the video with the face warps ----------
    const gl = canvas.getContext('webgl', { premultipliedAlpha: false });

    const vertSrc = `
      attribute vec2 a;
      varying vec2 vUv;
      void main() {
        vUv = vec2(a.x * 0.5 + 0.5, 0.5 - a.y * 0.5); // top-left origin, same as landmarks
        gl_Position = vec4(a, 0.0, 1.0);
      }`;

    // All positions are in video pixels. Data is packed into vec4s to stay within the uniform
    // limits of phone GPUs. Up to 4 faces: 4 pulse regions and 2 brows each.
    const fragSrc = `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D tex;
      uniform vec2 res;
      uniform float scale;        // pulse: >1 enlarges, <1 shrinks
      uniform vec4 pulse[16];     // xy centre, z radius (0 = off)
      uniform vec4 browEnds[8];   // xy outer end, zw inner end
      uniform vec4 browMid[8];    // xy middle of the arch, z half thickness, w lift in pixels (0 = off)
      uniform vec4 browFace[8];   // xy the face's "down", zw the point between its brows
      uniform float browSpan[8];  // from between the brows to a brow's outer end
      uniform float waveAt;       // where the wave is, -1 (one outer end) to 1 (the other)

      // Magnify or pinch around c, easing back to no change at radius r so there is no seam.
      vec2 pulseAt(vec2 p, vec4 region) {
        float r = region.z;
        vec2 d = p - region.xy;
        float dist = length(d) / r;
        if (r <= 0.0 || dist >= 1.0) return p;
        return region.xy + d * mix(1.0 / scale, 1.0, smoothstep(0.0, 1.0, dist));
      }

      // Lift the brows with a "Mexican wave" that travels from one brow across to the other:
      // whichever part of a brow the wave is passing lifts up, then settles as it moves on.
      // The brow's arch is modelled as a parabola through its ends and middle; the lift fades
      // out away from it and past its ends, gently enough that the image never folds.
      vec2 browAt(vec2 p, vec4 ends, vec4 mid, vec4 face, float span) {
        float th = mid.z, amp = mid.w;
        if (amp <= 0.0 || th <= 0.0) return p;
        vec2 a = ends.xy, b = ends.zw, down = face.xy, right = vec2(down.y, -down.x);
        vec2 ab = b - a;
        float t = dot(p - a, ab) / dot(ab, ab);
        float along = smoothstep(-0.25, 0.05, t) * (1.0 - smoothstep(0.95, 1.25, t));
        if (along <= 0.0) return p;
        float arch = dot(mid.xy - (a + b) * 0.5, down);
        float curveY = dot(ab * t, down) + 4.0 * t * (1.0 - t) * arch;
        float y = dot(p - a, down);
        // Fading over at least 2.2x the lift keeps the stretch gentle enough never to fold.
        float across = 1.0 - smoothstep(th, th + max(th * 6.0, amp * 2.2), abs(y - curveY));
        float pos = dot(p - face.zw, right) / span;
        float lift = exp(-pow(pos - waveAt, 2.0) / 0.18);
        return p + down * (amp * lift * along * across);
      }

      void main() {
        vec2 p = vUv * res;
        for (int i = 0; i < 16; i++) p = pulseAt(p, pulse[i]);
        for (int i = 0; i < 8; i++) p = browAt(p, browEnds[i], browMid[i], browFace[i], browSpan[i]);
        gl_FragColor = texture2D(tex, p / res);
      }`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const aLoc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(aLoc);
    gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    const uniforms = {};
    for (const name of ['res', 'scale', 'pulse', 'browEnds', 'browMid', 'browFace', 'browSpan', 'waveAt']) {
      uniforms[name] = gl.getUniformLocation(prog, name);
    }

    // ---------- Face tracking ----------
    // Each person on screen is a "track" that is matched to the nearest face every frame, so
    // filtering, hair and colours stay with the right person. Landmarks come with depth, so each
    // person's head is followed in 3D.
    let landmarker = null;
    let lastVideoTime = -1, lastDetectAt = 0;
    let tracks = [];
    let nextTrackId = 1;

    async function createTask(Task, options) {
      const fileset = await FilesetResolver.forVisionTasks(WASM);
      try {
        return await Task.createFromOptions(fileset, { ...options, baseOptions: { ...options.baseOptions, delegate: 'GPU' } });
      } catch {
        return await Task.createFromOptions(fileset, { ...options, baseOptions: { ...options.baseOptions, delegate: 'CPU' } });
      }
    }

    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function measureFeature(face, feature) {
      const c = mid(face[feature.centre[0]], face[feature.centre[1]]);
      return { x: c.x, y: c.y, r: dist(face[feature.width[0]], face[feature.width[1]]) * feature.size };
    }

    function measureBrow(face, b) {
      const [o, m, i] = [b.outer, b.mid, b.inner].map(([up, low]) => mid(face[up], face[low]));
      return { ax: o.x, ay: o.y, mx: m.x, my: m.y, bx: i.x, by: i.y, th: dist(face[b.mid[0]], face[b.mid[1]]) / 2 };
    }

    function measureHead(face) {
      const top = face[FOREHEAD], chin = face[CHIN];
      const size = dist(top, chin);
      return {
        // A little above the middle of the face, roughly the centre of the skull.
        cx: chin.x + (top.x - chin.x) * 0.62, cy: chin.y + (top.y - chin.y) * 0.62,
        ux: (top.x - chin.x) / size, uy: (top.y - chin.y) / size, // "up" the face, on screen
        size
      };
    }

    function measure(face) {
      return {
        eyes: EYES.map(e => measureFeature(face, e)),
        nose: measureFeature(face, NOSE),
        mouth: measureFeature(face, MOUTH),
        brows: BROWS.map(b => measureBrow(face, b)),
        head: measureHead(face)
      };
    }

    // One Euro filter: strong smoothing when a point is still (no jitter), almost none when it's
    // moving fast (no lag), so overlays stay locked to the face.
    class OneEuro {
      constructor(minCutoff, beta) { this.minCutoff = minCutoff; this.beta = beta; this.x = null; this.dx = null; }
      filter(v, dt) {
        if (!this.x) { this.x = Float32Array.from(v); this.dx = new Float32Array(v.length); return this.x; }
        const alpha = cutoff => 1 / (1 + 1 / (2 * Math.PI * cutoff * dt));
        const ad = alpha(1);
        for (let i = 0; i < v.length; i++) {
          this.dx[i] += ((v[i] - this.x[i]) / dt - this.dx[i]) * ad;
          this.x[i] += (v[i] - this.x[i]) * alpha(this.minCutoff + this.beta * Math.abs(this.dx[i]));
        }
        return this.x;
      }
    }

    // Landmarks in pixels, with depth in the same units (bigger z is nearer the camera).
    const toPoints = flat => Array.from({ length: flat.length / 3 }, (_, i) => ({ x: flat[i * 3], y: flat[i * 3 + 1], z: flat[i * 3 + 2] }));

    function track(w, h) {
      if (!landmarker || video.currentTime === lastVideoTime) return false;
      lastVideoTime = video.currentTime;
      const now = performance.now(), dt = Math.max(0.005, Math.min(0.1, (now - lastDetectAt) / 1000));
      lastDetectAt = now;

      const result = landmarker.detectForVideo(video, now);
      const found = result.faceLandmarks.map((raw, n) => {
        const flat = new Float32Array(raw.length * 3);
        raw.forEach((p, i) => { flat[i * 3] = p.x * w; flat[i * 3 + 1] = p.y * h; flat[i * 3 + 2] = -p.z * w; });
        const face = toPoints(flat);
        return { flat, face, m: measure(face), rot: poseAxes(result.facialTransformationMatrixes?.[n]) };
      });
      faceBadge.hidden = found.length > 0;

      // Match each existing person to the nearest new face, closest pairs first.
      const pairs = [];
      tracks.forEach(t => found.forEach(f => {
        const d = Math.hypot(t.m.head.cx - f.m.head.cx, t.m.head.cy - f.m.head.cy);
        if (d < t.m.head.size * 0.7) pairs.push({ t, f, d });
      }));
      pairs.sort((a, b) => a.d - b.d);
      const usedTracks = new Set(), usedFaces = new Set();
      for (const { t, f } of pairs) {
        if (usedTracks.has(t) || usedFaces.has(f)) continue;
        usedTracks.add(t); usedFaces.add(f);
        t.face = toPoints(t.filter.filter(f.flat, dt));
        t.m = measure(t.face);
        t.rot = f.rot && t.rotFilter.filter(f.rot, dt);
        t.fade += (1 - t.fade) * 0.3;
      }
      // People who have gone fade out; new faces start new tracks.
      for (const t of tracks) if (!usedTracks.has(t)) { t.fade *= 0.8; t.face = null; }
      for (const t of tracks) if (t.fade <= 0.02) disposeGfx(t);
      tracks = tracks.filter(t => t.fade > 0.02);
      for (const f of found) {
        if (usedFaces.has(f) || tracks.length >= MAX_FACES) continue;
        const filter = new OneEuro(1.2, 0.05), rotFilter = new OneEuro(1.5, 0.3);
        const face = toPoints(filter.filter(f.flat, dt));
        tracks.push({ id: nextTrackId++, filter, rotFilter, face, m: measure(face), rot: f.rot && rotFilter.filter(f.rot, dt), fade: 0.3, hair: newHairState() });
      }
      return true;
    }

    // ---------- 3D head ----------
    // A head frame built from the 3D landmarks every frame: origin near the middle of the skull,
    // R to the person's right on screen, U up the face, F out of the face towards the camera,
    // and S the face height in pixels.
    const v3 = (x, y, z) => ({ x, y, z });
    const sub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
    const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
    const scale3 = (a, k) => v3(a.x * k, a.y * k, a.z * k);
    const add3 = (...vs) => vs.reduce((a, b) => v3(a.x + b.x, a.y + b.y, a.z + b.z));
    const norm = a => scale3(a, 1 / (Math.hypot(a.x, a.y, a.z) || 1));
    const cross = (a, b) => v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
    const EAR_L = 234, EAR_R = 454, NOSE_TIP = 1;
    // The jawline from one corner of the jaw, round the chin, to the other.
    const NECK_JAW = [172, 136, 150, 149, 176, 148, 152, 377, 400, 378, 379, 365, 397];

    // MediaPipe's own 3D head pose (its face model fitted to the landmarks) gives a steadier
    // rotation than a few landmarks do. Its axes, as a flat [R, U, F] array in screen space
    // (y down), or null if it isn't available.
    function poseAxes(mat) {
      if (!mat || !mat.data || mat.data.length < 16) return null;
      const d = mat.data;
      // The translation (tens of centimetres away from the camera) tells us the layout.
      const colMajor = Math.abs(d[14]) > Math.abs(d[11]);
      const e = (r, c) => colMajor ? d[c * 4 + r] : d[r * 4 + c];
      const axes = new Float32Array(9);
      for (let c = 0; c < 3; c++) {
        const x = e(0, c), y = -e(1, c), z = e(2, c), l = Math.hypot(x, y, z) || 1;
        axes[c * 3] = x / l; axes[c * 3 + 1] = y / l; axes[c * 3 + 2] = z / l;
      }
      return axes;
    }

    function headFrame(face, rot) {
      const l = face[EAR_L], r = face[EAR_R], top = face[FOREHEAD], chin = face[CHIN];
      let R = norm(sub(r, l));
      const up = sub(top, chin);
      let U = norm(sub(up, scale3(R, dot(up, R))));
      let F = norm(cross(R, U));
      const ears = scale3(add3(l, r), 0.5);
      if (dot(sub(face[NOSE_TIP], ears), F) < 0) F = scale3(F, -1);
      if (rot) {
        // Use the fitted pose's rotation, lined up with the landmark directions (so its axis
        // conventions can't flip anything), then made exactly perpendicular again.
        const axis = (i, ref) => { const a = v3(rot[i * 3], rot[i * 3 + 1], rot[i * 3 + 2]); return dot(a, ref) < 0 ? scale3(a, -1) : a; };
        const pr = axis(0, R), pu = axis(1, U), pf = axis(2, F);
        if (dot(pr, R) > 0.7 && dot(pu, U) > 0.7) {
          R = norm(pr);
          U = norm(sub(pu, scale3(R, dot(pu, R))));
          F = norm(cross(R, U));
          if (dot(F, pf) < 0) F = scale3(F, -1);
        }
      }
      const S = Math.hypot(up.x, up.y, up.z);
      const O = add3(ears, scale3(U, 0.1 * S), scale3(F, -0.05 * S));
      return { O, R, U, F, S, width: Math.hypot(r.x - l.x, r.y - l.y, r.z - l.z) };
    }

    const toLocal = (hf, p) => { const d = sub(p, hf.O); return v3(dot(d, hf.R), dot(d, hf.U), dot(d, hf.F)); };
    const toWorld = (hf, x, y, z) => v3(
      hf.O.x + hf.R.x * x + hf.U.x * y + hf.F.x * z,
      hf.O.y + hf.R.y * x + hf.U.y * y + hf.F.y * z,
      hf.O.z + hf.R.z * x + hf.U.z * y + hf.F.z * z);

    // ---------- Hair ----------
    // Hair is simulated and drawn in 3D. Each person's head and hair is modelled as an ellipsoid
    // fitted to their face landmarks and to the outline of their real hair (from MediaPipe's
    // segmenter). Guide strands rooted over the hair-covered part of it carry momentum, fall
    // under gravity and are kept outside it; thousands of drawn strands follow the guides.
    // Three.js draws them on the GPU with depth, so the face, head and body hide whatever is
    // behind them.
    const BINS = 72;                 // directions around the head used to trace outlines
    const MAX_ANGLE = 1.95;          // radians either side of straight up (~112°)
    const SHOULDER_BINS = 41;        // columns across the body, 2 face heights either side
    const GUIDES = MOBILE ? 150 : 300; // simulated guide strands per person
    const NODES = MOBILE ? 10 : 13;  // segments per guide strand
    const POINTS = NODES + 1;
    const ITERATIONS = MOBILE ? 3 : 4; // constraint passes per frame
    const STRANDS = MOBILE ? 1600 : 5500; // drawn strands per person (shared out if several)
    const HAIR_SCALE = MOBILE ? 0.75 : 1; // the 3D layer renders at this fraction of the video's size
    const GRAVITY = 3.2;             // face heights per second²
    const GROW_STEP = 0.3;           // face heights added per press
    // Segments get longer towards the tip: short ones near the root let the hair bend closely
    // round the head, longer ones further down keep the cost down.
    const SEG_WEIGHTS = (() => {
      const w = Array.from({ length: NODES }, (_, i) => Math.pow(1.12, i));
      const sum = w.reduce((a, b) => a + b, 0);
      return w.map(v => v / sum);
    })();

    const hair = {
      segmenter: null,
      loading: false,
      length: 0,                     // current length in face heights (animates towards target)
      target: 0,
      frame: 0,
      analyses: 0,
      sampler: document.createElement('canvas')
    };

    function newHairState() {
      return {
        ready: false,
        updatedAt: 0,
        outline: new Float32Array(BINS).fill(0.62),  // 2D: head centre to the edge of their hair
        hairline: new Float32Array(BINS).fill(0.5),  // 2D: head centre to where their hair starts
        // How far below the head's centre their neck and shoulders start, in face heights,
        // across the body. Hair behind them is hidden. Starts as a typical shape.
        shoulders: Float32Array.from({ length: SHOULDER_BINS }, (_, c) => {
          const x = Math.abs(-2 + 4 * c / (SHOULDER_BINS - 1));
          return x < 0.35 ? 0.72 : 1 + (x - 0.35) * 0.12;
        }),
        palette: ['#2a1d15', '#35251a', '#402d20', '#4d3727', '#5c4331', '#6e533e'],
        shape: null                  // the fitted head ellipsoid, smoothed
      };
    }

    // Deterministic random numbers so the hairstyle stays the same between frames.
    function random(seed) {
      return () => {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    async function loadSegmenter() {
      hair.loading = true;
      growHair.disabled = true;
      growHair.querySelector('span').textContent = 'Loading…';
      try {
        hair.segmenter = await createTask(ImageSegmenter, {
          baseOptions: { modelAssetPath: SEGMENT_MODEL },
          runningMode: 'VIDEO',
          outputCategoryMask: true,
          outputConfidenceMasks: false
        });
      } catch (err) {
        faceBadge.textContent = `Hair model failed to load: ${err.message}`;
        faceBadge.hidden = false;
      }
      hair.loading = false;
      growHair.disabled = false;
      growHair.querySelector('span').textContent = 'Grow hair';
    }

    growHair.addEventListener('click', async () => {
      if (!hair.segmenter && !hair.loading) await loadSegmenter();
      if (!hair.segmenter) return;
      hair.target += GROW_STEP;
      resetHair.hidden = false;
    });

    resetHair.addEventListener('click', () => {
      hair.target = 0;
      hair.mullet = 0;
      mullet.cutAt = Infinity;
      resetHair.hidden = true;
    });

    // 2D head-relative polar coordinates: angle from "up" (positive towards image right) and
    // distance in face heights. Used for tracing the real hair in the segmentation mask.
    function toPolar(head, x, y) {
      const dx = x - head.cx, dy = y - head.cy;
      const along = dx * -head.uy + dy * head.ux, up = dx * head.ux + dy * head.uy;
      return { a: Math.atan2(along, up), r: Math.hypot(dx, dy) / head.size };
    }

    function binAngle(i) { return (i / (BINS - 1) * 2 - 1) * MAX_ANGLE; }

    function sampleBins(values, angle) {
      const f = (angle / MAX_ANGLE + 1) / 2 * (BINS - 1);
      const i = Math.max(0, Math.min(BINS - 2, Math.floor(f)));
      const t = Math.max(0, Math.min(1, f - i));
      return values[i] * (1 - t) + values[i + 1] * t;
    }

    // Turn the colours of real hair pixels into six shades, darkest to lightest. The brightest
    // third is dropped: it's usually background or glare showing through at the edges.
    function paletteFrom(colours) {
      colours.sort((p, q) => p[0] - q[0]);
      const core = colours.slice(Math.floor(colours.length * 0.03), Math.ceil(colours.length * 0.67));
      return [0.05, 0.2, 0.38, 0.55, 0.72, 0.9].map(q => {
        const c = Math.floor(q * core.length), band = Math.max(1, Math.floor(core.length * 0.04));
        let r = 0, g = 0, b = 0, n = 0;
        for (let k = Math.max(0, c - band); k < Math.min(core.length, c + band); k++, n++) {
          r += core[k][1]; g += core[k][2]; b += core[k][3];
        }
        return `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;
      });
    }

    const toScreen = (head, x, y) => [head.cx - x * head.uy - y * head.ux, head.cy + x * head.ux - y * head.uy];

    // Segment the frame once, then for each person trace the outline of their real hair, their
    // neck and shoulders, and pick up their hair colours.
    function analyseHair(w, h) {
      const result = hair.segmenter.segmentForVideo(video, performance.now());
      const mask = result.categoryMask;
      if (!mask) { result.close(); return; }
      const mw = mask.width, mh = mask.height;
      const cats = mask.getAsUint8Array();
      const hairAt = (mx, my) => mx >= 0 && my >= 0 && mx < mw && my < mh && cats[my * mw + mx] === HAIR_CATEGORY;
      const isHair = (x, y) => hairAt(Math.round(x * mw / w), Math.round(y * mh / h));

      // Colours are read from a small copy of the frame; step is how many mask pixels per sample.
      const sampleColours = tracks.some(t => !t.hair.ready) || hair.analyses % 4 === 0;
      const step = Math.max(1, Math.round(mw / 192));
      const sw = Math.ceil(mw / step), sh = Math.ceil(mh / step);
      let px = null;
      if (sampleColours) {
        const s = hair.sampler;
        if (s.width !== sw || s.height !== sh) { s.width = sw; s.height = sh; }
        const sctx = s.getContext('2d', { willReadFrequently: true });
        sctx.drawImage(video, 0, 0, sw, sh);
        px = sctx.getImageData(0, 0, sw, sh).data;
      }
      const pixel = (mx, my) => ((Math.floor(my / step) * sw) + Math.floor(mx / step)) * 4;

      for (const t of tracks) {
        if (!t.face) continue;
        const head = t.m.head, S = head.size, st = t.hair;
        const rx = -head.uy, ry = head.ux;

        // The face's edge in each direction, from the face-oval landmarks.
        const oval = FACE_OVAL.map(j => toPolar(head, t.face[j].x, t.face[j].y)).sort((p, q) => p.a - q.a);
        const hairline = new Float32Array(BINS);
        for (let i = 0; i < BINS; i++) {
          const a = binAngle(i);
          let k = oval.findIndex(o => o.a >= a);
          if (k <= 0) k = k === 0 ? 1 : oval.length - 1;
          const p = oval[k - 1], q = oval[k], f = Math.max(0, Math.min(1, (a - p.a) / ((q.a - p.a) || 1)));
          hairline[i] = p.r + (q.r - p.r) * f;
        }

        // March outwards from the edge of the face in each direction. Where their real hair
        // starts is the hairline the new hair roots from; the last hair pixel before a clear
        // run of non-hair is its outer edge. Only hair close to the face counts, so someone
        // else's hair nearby isn't mistaken for theirs.
        const start = new Float32Array(BINS), traced = new Float32Array(BINS);
        for (let i = 0; i < BINS; i++) {
          const a = binAngle(i), face = hairline[i];
          const dx = Math.cos(a) * head.ux + Math.sin(a) * rx, dy = Math.cos(a) * head.uy + Math.sin(a) * ry;
          let first = 0, edge = 0, misses = 0;
          for (let r = face * 0.9; r < face + 0.7; r += 0.012) {
            if (isHair(head.cx + dx * r * S, head.cy + dy * r * S)) {
              if (!first) first = r;
              edge = r; misses = 0;
            } else if (edge ? ++misses > 8 : r > face + 0.2) break;
          }
          // No hair that way (bald patch, or beside the face): grow from just past the face's edge.
          start[i] = first ? Math.max(first, face) : face + 0.04;
          traced[i] = edge ? Math.max(edge, start[i]) : start[i];
        }
        // Smooth across neighbouring directions, then over time.
        const blur = (v, i) => {
          let sum = 0, n = 0;
          for (let k = -2; k <= 2; k++) if (i + k >= 0 && i + k < BINS) { sum += v[i + k]; n++; }
          return sum / n;
        };
        for (let i = 0; i < BINS; i++) {
          const o = blur(traced, i), l = blur(start, i);
          st.outline[i] = st.ready ? st.outline[i] + (o - st.outline[i]) * 0.35 : o;
          st.hairline[i] = st.ready ? st.hairline[i] + (l - st.hairline[i]) * 0.35 : l;
        }

        // This person's own hair colours: only hair pixels near their head and well inside the
        // hair, so the background at its edge and other people's hair don't leak in.
        if (px) {
          const colours = [];
          const x0 = Math.max(1, Math.floor((head.cx - 1.3 * S) * mw / w)), x1 = Math.min(mw - 2, Math.ceil((head.cx + 1.3 * S) * mw / w));
          const y0 = Math.max(1, Math.floor((head.cy - 1.3 * S) * mh / h)), y1 = Math.min(mh - 2, Math.ceil((head.cy + 1.3 * S) * mh / h));
          for (let my = y0; my <= y1; my += step) {
            for (let mx = x0; mx <= x1; mx += step) {
              if (!(hairAt(mx, my) && hairAt(mx - step, my) && hairAt(mx + step, my) && hairAt(mx, my - step) && hairAt(mx, my + step))) continue;
              const pol = toPolar(head, mx * w / mw, my * h / mh);
              if (pol.r > 1.3 || Math.abs(pol.a) > MAX_ANGLE) continue;
              const i = pixel(mx, my), r = px[i], g = px[i + 1], b = px[i + 2];
              colours.push([0.3 * r + 0.59 * g + 0.11 * b, r, g, b]);
            }
          }
          // Little or no hair to go on (very short or none): use the colour of their eyebrows.
          if (colours.length < 150) {
            for (const b of t.m.brows) {
              for (let k = 0; k <= 12; k++) {
                const f = k / 12, x = b.ax + (b.bx - b.ax) * f, y = b.ay + (b.by - b.ay) * f;
                const mx = Math.round(x * mw / w), my = Math.round(y * mh / h);
                if (mx < 0 || my < 0 || mx >= mw || my >= mh) continue;
                const i = pixel(mx, my), r = px[i], g = px[i + 1], bl = px[i + 2];
                colours.push([0.3 * r + 0.59 * g + 0.11 * bl, r, g, bl]);
              }
            }
          }
          if (colours.length > 20) st.palette = paletteFrom(colours);
        }
        // Trace their neck and shoulders: in each column across the body, the first skin or
        // clothing pixel from about chin height down (the neck is often labelled as face skin).
        for (let c = 0; c < SHOULDER_BINS; c++) {
          const hx = -2 + 4 * c / (SHOULDER_BINS - 1);
          for (let d = 0.55; d < 3; d += 0.02) {
            const x = head.cx + (hx * rx - d * head.ux) * S, y = head.cy + (hx * ry - d * head.uy) * S;
            const mx = Math.round(x * mw / w), my = Math.round(y * mh / h);
            if (mx < 0 || my < 0 || mx >= mw || my >= mh) break;
            const cat = cats[my * mw + mx];
            if (cat === BODY_SKIN || cat === FACE_SKIN || cat === CLOTHES) {
              st.shoulders[c] = st.ready ? st.shoulders[c] + (d - st.shoulders[c]) * 0.35 : d;
              break;
            }
          }
        }
        st.ready = true;
        st.updatedAt = performance.now();
      }
      result.close();
      hair.analyses++;
    }

    // Fit the head-and-hair ellipsoid (semi-axes a right, b up, c front-to-back, in pixels) to the
    // landmarks and, once it's known, to the outline of their real hair.
    function fitShape(t, hf) {
      const st = t.hair, S = hf.S, head = t.m.head;
      const brow = toLocal(hf, t.face[FOREHEAD]);
      let a = hf.width * 0.54, b = brow.y + 0.3 * S;
      if (st.ready) {
        // Where the top and sides of their real hair are, measured on screen.
        const onScreen = angle => {
          const r = sampleBins(st.outline, angle) * S;
          const [x, y] = toScreen(head, Math.sin(angle) * r, -Math.cos(angle) * r);
          return toLocal(hf, v3(x, y, hf.O.z));
        };
        b = Math.max(b, onScreen(0).y + 0.02 * S);
        a = Math.max(a, (Math.abs(onScreen(1.5).x) + Math.abs(onScreen(-1.5).x)) / 2 + 0.02 * S);
      }
      a = Math.min(a, 0.95 * S); b = Math.min(b, 1.1 * S);
      // Deep enough front to back that the forehead sits on the surface.
      const c = Math.max(a * 1.05, brow.z / Math.sqrt(Math.max(0.15, 1 - (brow.y / b) ** 2)));
      // Where the hairline is at the front, as a height on the unit sphere.
      const front = Math.min(0.9, brow.y / b + 0.1);
      const target = { a, b, c, front };
      if (!st.shape) st.shape = target;
      else for (const k in target) st.shape[k] += (target[k] - st.shape[k]) * 0.1;
      return st.shape;
    }

    // Is this direction on the unit sphere covered in hair? Above the hairline at the front,
    // above the ears at the sides, down to the nape at the back.
    // fuzz roughens the line so it isn't a clean edge.
    function inHair(d, front, fuzz = 0) {
      const sides = 0.2, back = -0.45;
      // Recedes a little at the temples, stays high across them, and drops only near the ears.
      const frontLine = front + 0.12 * Math.abs(d.x) + fuzz;
      const line = d.z >= 0 ? sides + (frontLine - sides) * Math.min(1, d.z / 0.45) : sides + (back - sides) * -d.z + fuzz;
      return d.y >= line;
    }

    // Guide and drawn strand roots over the hair-covered part of the head, as unit-sphere
    // directions. Made once per person (their hairline sets which part is covered).
    function makeRoots(front) {
      const rnd = random(4321);
      const cand = [];
      const N = 8000, golden = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < N; i++) {
        const y = 1 - (i + 0.5) / N * 2, r = Math.sqrt(1 - y * y), th = golden * i;
        const d = v3(Math.cos(th) * r, y, Math.sin(th) * r);
        if (inHair(d, front, (rnd() - 0.5) * 0.08)) cand.push(d);
      }
      const guides = [];
      const stride = cand.length / GUIDES;
      for (let i = 0; i < GUIDES; i++) {
        const d = cand[Math.floor(i * stride)];
        guides.push({
          dir: d,
          side: Math.abs(d.x) < 0.04 ? (rnd() < 0.5 ? -1 : 1) : Math.sign(d.x),
          lengthF: 0.85 + rnd() * 0.3,
          stiffness: 0.5 + rnd() * 0.5,
          phase: rnd() * Math.PI * 2,
          p: new Float32Array(POINTS * 3), q: new Float32Array(POINTS * 3), init: false
        });
      }
      const strands = [];
      for (let n = 0; n < STRANDS; n++) {
        const gi = Math.floor(rnd() * GUIDES), g = guides[gi];
        // A root near its guide's, jittered over the scalp.
        const d = norm(v3(g.dir.x + (rnd() - 0.5) * 0.12, g.dir.y + (rnd() - 0.5) * 0.12, g.dir.z + (rnd() - 0.5) * 0.12));
        strands.push({
          gi, dir: inHair(d, front, (rnd() - 0.5) * 0.08) ? d : g.dir,
          lengthF: g.lengthF * (0.8 + rnd() * 0.25),
          shade: Math.min(5, Math.floor(Math.pow(rnd(), 1.3) * 6)),
          curl: (0.004 + rnd() * 0.012), curlFreq: 4 + rnd() * 8, phase: rnd() * Math.PI * 2,
          spread: (rnd() - 0.5) * 2
        });
      }
      return { guides, strands, front };
    }

    // A root on the surface (slightly outside it), and the way the hair leaves it: lying along
    // the scalp, away from a centre parting and down, and more straight down at the back.
    function rootAt(hf, shape, d, side, lift = 1.012) {
      const { a, b, c } = shape;
      const p = toWorld(hf, d.x * a * lift, d.y * b * lift, d.z * c * lift);
      const n = norm(v3(d.x / a, d.y / b, d.z / c));
      const v = v3(side * 0.8 * (1 - Math.max(0, -d.z) * 0.7), -0.75, -0.35);
      const tl = norm(sub(v, scale3(n, dot(v, n))));
      const tw = norm(add3(scale3(hf.R, tl.x), scale3(hf.U, tl.y), scale3(hf.F, tl.z)));
      return { p, t: tw };
    }

    // Step one person's guide strands.
    function simulate(t, hf, shape, dt, time, bodyZ) {
      const S = hf.S, total = hair.length * S;
      const { a, b, c } = shape;
      const jumped = !t.gfx.last || Math.hypot(hf.O.x - t.gfx.last.x, hf.O.y - t.gfx.last.y) > S * 0.5;
      t.gfx.last = hf.O;
      const damping = Math.exp(-dt * 3), g = GRAVITY * S * dt * dt;
      const segs = new Float32Array(NODES);
      // Guides rest just outside the head, standing off it more as the hair gets longer.
      const m = 1.015 + 0.035 * Math.min(1, hair.length / 1.5);
      // Neck and shoulders: a slab through the body; hair landing on it falls in front of or
      // behind the shoulders instead of through them.
      const head = t.m.head, shoulders = t.hair.shoulders, slab = 0.3 * S;
      // In front of the face, from the brow to the chin, hair can't hang: it's pushed out to the
      // sides, so it parts and falls either side of the face, framing it.
      const browY = toLocal(hf, t.face[FOREHEAD]).y, chinY = toLocal(hf, t.face[CHIN]).y;
      const faceHalf = hf.width * 0.47;

      for (const G of t.gfx.roots.guides) {
        const len = styledLength(G.dir, total * G.lengthF, S);
        // While growing, new length is added without any speed, so strands don't whip about.
        const growing = G.len !== undefined && len > G.len + 1e-6;
        G.len = len;
        if (len < S * 0.01) { G.init = false; continue; }
        for (let i = 0; i < NODES; i++) segs[i] = len * SEG_WEIGHTS[i];
        const { p: r, t: tw } = rootAt(hf, shape, G.dir, G.side);
        const p = G.p, q = G.q;
        if (!G.init || jumped) {
          // Start draped: along the scalp at first, turning downwards.
          let x = r.x, y = r.y, z = r.z;
          for (let i = 0; i < POINTS; i++) {
            p[i * 3] = q[i * 3] = x; p[i * 3 + 1] = q[i * 3 + 1] = y; p[i * 3 + 2] = q[i * 3 + 2] = z;
            if (i === NODES) break;
            const f = Math.min(1, i / 4);
            const dir = norm(v3(tw.x * (1 - f), tw.y * (1 - f) + f, tw.z * (1 - f)));
            x += dir.x * segs[i]; y += dir.y * segs[i]; z += dir.z * segs[i];
          }
          G.init = true;
        }
        p[0] = q[0] = r.x; p[1] = q[1] = r.y; p[2] = q[2] = r.z;

        // Momentum, gravity (down the screen) and a faint breeze.
        const breeze = Math.sin(time * 0.9 + G.phase) * 0.12 * S * dt * dt;
        for (let i = 1; i < POINTS; i++) {
          const k = i * 3;
          const vx = (p[k] - q[k]) * damping, vy = (p[k + 1] - q[k + 1]) * damping, vz = (p[k + 2] - q[k + 2]) * damping;
          q[k] = p[k]; q[k + 1] = p[k + 1]; q[k + 2] = p[k + 2];
          p[k] += vx + breeze * i / NODES; p[k + 1] += vy + g; p[k + 2] += vz;
        }

        for (let it = 0; it < ITERATIONS; it++) {
          // Keep each segment its proper length.
          for (let i = 1; i < POINTS; i++) {
            const k = i * 3, j = k - 3;
            const ex = p[k] - p[j], ey = p[k + 1] - p[j + 1], ez = p[k + 2] - p[j + 2];
            const d = Math.hypot(ex, ey, ez) || 1, diff = (d - segs[i - 1]) / d;
            if (growing && diff < 0) {
              // New length hangs downwards (where gravity would take it) rather than pushing the
              // strand out along its current direction, and adds no speed.
              const need = segs[i - 1] - d;
              let gx = ex / d * 0.3, gy = ey / d * 0.3 + 0.7, gz = ez / d * 0.3;
              const gl = Math.hypot(gx, gy, gz) || 1; gx *= need / gl; gy *= need / gl; gz *= need / gl;
              p[k] += gx; p[k + 1] += gy; p[k + 2] += gz;
              q[k] += gx; q[k + 1] += gy; q[k + 2] += gz;
              continue;
            }
            if (i === 1) { p[k] -= ex * diff; p[k + 1] -= ey * diff; p[k + 2] -= ez * diff; }
            else {
              p[k] -= ex * diff * 0.5; p[k + 1] -= ey * diff * 0.5; p[k + 2] -= ez * diff * 0.5;
              p[j] += ex * diff * 0.5; p[j + 1] += ey * diff * 0.5; p[j + 2] += ez * diff * 0.5;
            }
          }
          // The first short segment leaves along the scalp, so the root lies flat.
          const k1 = 0.7 * G.stiffness;
          p[3] += (r.x + tw.x * segs[0] - p[3]) * k1;
          p[4] += (r.y + tw.y * segs[0] - p[4]) * k1;
          p[5] += (r.z + tw.z * segs[0] - p[5]) * k1;
          // Outside the head: push any point inside the ellipsoid back out to its surface.
          for (let i = 1; i < POINTS; i++) {
            const k = i * 3;
            const dx = p[k] - hf.O.x, dy = p[k + 1] - hf.O.y, dz = p[k + 2] - hf.O.z;
            const lx = dx * hf.R.x + dy * hf.R.y + dz * hf.R.z;
            const ly = dx * hf.U.x + dy * hf.U.y + dz * hf.U.z;
            const lz = dx * hf.F.x + dy * hf.F.y + dz * hf.F.z;
            const e = (lx / a) ** 2 + (ly / b) ** 2 + (lz / c) ** 2;
            if (e < m * m) {
              const f = m / Math.sqrt(e) - 1;
              p[k] += (hf.R.x * lx + hf.U.x * ly + hf.F.x * lz) * f;
              p[k + 1] += (hf.R.y * lx + hf.U.y * ly + hf.F.y * lz) * f;
              p[k + 2] += (hf.R.z * lx + hf.U.z * ly + hf.F.z * lz) * f;
            } else if (lz > 0.05 * S && ly < browY + 0.05 * S && ly > chinY - 0.05 * S && Math.abs(lx) < faceHalf) {
              const out = (Math.abs(lx) > 0.05 * S ? Math.sign(lx) : G.side) * faceHalf - lx;
              p[k] += hf.R.x * out; p[k + 1] += hf.R.y * out; p[k + 2] += hf.R.z * out;
            }
            // Below their traced shoulder line and inside the body: out to its front or back.
            if (Math.abs(p[k + 2] - bodyZ) < slab) {
              const sx = p[k] - head.cx, sy = p[k + 1] - head.cy;
              const across = (sx * -head.uy + sy * head.ux) / head.size, below = -(sx * head.ux + sy * head.uy) / head.size;
              const col = (across + 2) / 4 * (SHOULDER_BINS - 1);
              if (col >= 0 && col <= SHOULDER_BINS - 1) {
                const c0 = Math.min(SHOULDER_BINS - 2, Math.floor(col)), cf = col - c0;
                if (below > shoulders[c0] * (1 - cf) + shoulders[c0 + 1] * cf) {
                  p[k + 2] = bodyZ + (p[k + 2] >= bodyZ ? slab : -slab);
                }
              }
            }
          }
        }
        // While growing, damp the hair hard so the corrections above settle it into place
        // instead of flinging it.
        if (growing) for (let k = 3; k < POINTS * 3; k++) q[k] = p[k] - (p[k] - q[k]) * 0.3;
      }
    }

    // ---------- Three.js scene ----------
    const renderer = new THREE.WebGLRenderer({ canvas: hairCanvas, alpha: true, antialias: !MOBILE, premultipliedAlpha: true });
    renderer.setPixelRatio(1);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // colours are used exactly as sampled
    const scene = new THREE.Scene();
    // Orthographic and in video pixels, so 3D points land exactly on the landmarks they came
    // from; depth only decides what is in front of what.
    const camera = new THREE.OrthographicCamera(0, 1, 0, 1, -1e5, 1e5);
    const occluderMaterial = new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide });
    const LIGHT = norm(v3(0.3, -0.8, 0.55)); // from above and in front (screen y points down)
    const HALF = norm(add3(LIGHT, v3(0, 0, 1)));

    // A mesh of camera-facing ribbons, one per strand, rebuilt from points every frame.
    function ribbonMesh(strands, points, material) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(strands * points * 2 * 3), 3).setUsage(THREE.DynamicDrawUsage));
      geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(strands * points * 2 * 3), 3).setUsage(THREE.DynamicDrawUsage));
      const idx = new Uint32Array(strands * (points - 1) * 6);
      let k = 0;
      for (let s = 0; s < strands; s++) {
        for (let j = 0; j < points - 1; j++) {
          const v = (s * points + j) * 2;
          idx.set([v, v + 1, v + 2, v + 1, v + 3, v + 2], k); k += 6;
        }
      }
      geo.setIndex(new THREE.BufferAttribute(idx, 1));
      const mesh = new THREE.Mesh(geo, material);
      mesh.frustumCulled = false;
      return mesh;
    }

    const parseRgb = str => (str.match(/\d+/g) || [0, 0, 0]).slice(0, 3).map(n => n / 255);
    const hexRgb = str => str.startsWith('#') ? [1, 3, 5].map(i => parseInt(str.slice(i, i + 2), 16) / 255) : parseRgb(str);

    // Write one strand's ribbon: pts is [x, y, z, ...] for `points` points. Shaded for hair:
    // brightest where the strand runs across the light, with a soft highlight, darker at the
    // roots and towards the back of the head.
    function writeRibbon(pos, col, s, pts, points, halfWidth, base, depthShade) {
      let v = s * points * 2 * 3;
      for (let j = 0; j < points; j++) {
        const k = j * 3, n = j < points - 1 ? k + 3 : k, pk = j < points - 1 ? k : k - 3;
        let tx = pts[n] - pts[pk], ty = pts[n + 1] - pts[pk + 1], tz = pts[n + 2] - pts[pk + 2];
        const tl = Math.hypot(tx, ty, tz) || 1; tx /= tl; ty /= tl; tz /= tl;
        const sl = Math.hypot(tx, ty) || 1, u = j / (points - 1);
        const w = halfWidth * (1 - 0.85 * u * u);
        const sx = -ty / sl * w, sy = tx / sl * w;
        const tL = tx * LIGHT.x + ty * LIGHT.y + tz * LIGHT.z, tH = tx * HALF.x + ty * HALF.y + tz * HALF.z;
        const diffuse = Math.sqrt(Math.max(0, 1 - tL * tL));
        const spec = Math.pow(Math.sqrt(Math.max(0, 1 - tH * tH)), 60);
        const shade = (0.35 + 0.75 * diffuse) * (0.6 + 0.4 * Math.min(1, j / 3)) * depthShade[j];
        const r = base[0] * shade + spec * 0.22, g = base[1] * shade + spec * 0.2, b = base[2] * shade + spec * 0.18;
        pos[v] = pts[k] + sx; pos[v + 1] = pts[k + 1] + sy; pos[v + 2] = pts[k + 2];
        pos[v + 3] = pts[k] - sx; pos[v + 4] = pts[k + 1] - sy; pos[v + 5] = pts[k + 2];
        col[v] = col[v + 3] = r; col[v + 1] = col[v + 4] = g; col[v + 2] = col[v + 5] = b;
        v += 6;
      }
    }

    // Each person's 3D objects: occluders (face, head, body) that only write depth, a wider,
    // darker underlayer of hair along each guide (so the scalp never shows through), the hair
    // strands and the beard.
    function makeGfx(t) {
      const group = new THREE.Group();
      const faceGeo = new THREE.BufferGeometry();
      faceGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((FACE_OVAL.length + 1) * 3), 3));
      faceGeo.setIndex(FACE_OVAL.flatMap((_, i) => [FACE_OVAL.length, i, (i + 1) % FACE_OVAL.length]));
      const face = new THREE.Mesh(faceGeo, occluderMaterial);
      const skull = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), occluderMaterial);
      const bodyGeo = new THREE.BufferGeometry();
      bodyGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SHOULDER_BINS * 2 * 3), 3));
      const bodyIdx = [];
      for (let c = 0; c < SHOULDER_BINS - 1; c++) bodyIdx.push(c * 2, c * 2 + 1, c * 2 + 2, c * 2 + 1, c * 2 + 3, c * 2 + 2);
      bodyGeo.setIndex(bodyIdx);
      const body = new THREE.Mesh(bodyGeo, occluderMaterial);
      // The neck: from the jawline straight down, in front of all the hair, so hair never shows
      // on the neck.
      const neckGeo = new THREE.BufferGeometry();
      neckGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NECK_JAW.length * 2 * 3), 3));
      const neckIdx = [];
      for (let i = 0; i < NECK_JAW.length - 1; i++) neckIdx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2);
      neckGeo.setIndex(neckIdx);
      const neck = new THREE.Mesh(neckGeo, occluderMaterial);
      for (const o of [face, skull, body, neck]) { o.renderOrder = -1; o.frustumCulled = false; }
      skull.matrixAutoUpdate = false;
      // Drawn just behind the strands at the same depth, so the strands always sit on top.
      const under = ribbonMesh(GUIDES * 2, POINTS, new THREE.MeshBasicMaterial({
        vertexColors: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 4
      }));
      const hairMesh = ribbonMesh(STRANDS, POINTS, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
      const beardMesh = ribbonMesh(BEARD_STRANDS.length, BEARD_POINTS, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
      // The beard sits on top of the face and neck, so it's drawn last and isn't hidden by them.
      beardMesh.material.depthTest = false;
      beardMesh.renderOrder = 10;
      group.add(face, skull, body, neck, under, hairMesh, beardMesh);
      scene.add(group);
      t.gfx = { group, face, skull, body, neck, under, hairMesh, beardMesh, roots: null, last: null, pts: new Float32Array(POINTS * 3), shade: new Float32Array(POINTS) };
    }

    function disposeGfx(t) {
      if (!t.gfx) return;
      scene.remove(t.gfx.group);
      t.gfx.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material !== occluderMaterial) o.material.dispose(); });
      t.gfx = null;
    }

    const ellipsoidMatrix = (m, hf, a, b, c) => m.set(
      hf.R.x * a, hf.U.x * b, hf.F.x * c, hf.O.x,
      hf.R.y * a, hf.U.y * b, hf.F.y * c, hf.O.y,
      hf.R.z * a, hf.U.z * b, hf.F.z * c, hf.O.z,
      0, 0, 0, 1);

    function updatePerson(t, count, dt, time) {
      if (!t.gfx) makeGfx(t);
      const G = t.gfx, hf = headFrame(t.face, t.rot), S = hf.S;
      const showHair = t.hair.ready && hair.length > 0.005;
      G.group.visible = t.fade > 0.5;

      // Occluders: the face as a fan of its outline (with real depth), the head, and the body
      // from the neck and shoulders down, standing just in front of the middle of the head so
      // hair falling behind the shoulders is hidden and locks falling in front are not.
      const fp = G.face.geometry.attributes.position;
      FACE_OVAL.forEach((j, i) => fp.setXYZ(i, t.face[j].x, t.face[j].y, t.face[j].z));
      const tip = t.face[NOSE_TIP];
      fp.setXYZ(FACE_OVAL.length, tip.x, tip.y, tip.z);
      fp.needsUpdate = true;
      // The neck hangs from the jaw, a little narrower than it, down past the shoulders.
      const np = G.neck.geometry.attributes.position, chin = t.face[CHIN], down = scale3(hf.U, -4 * S);
      NECK_JAW.forEach((j, i) => {
        const p = t.face[j];
        np.setXYZ(i * 2, p.x, p.y, tip.z);
        const bx = p.x + (chin.x - p.x) * 0.2, by = p.y + (chin.y - p.y) * 0.2;
        np.setXYZ(i * 2 + 1, bx + down.x, by + down.y, tip.z);
      });
      np.needsUpdate = true;

      if (!showHair) { G.skull.visible = G.under.visible = G.hairMesh.visible = G.body.visible = G.neck.visible = false; }
      else {
        const shape = fitShape(t, hf);
        if (!G.roots || Math.abs(G.roots.front - shape.front) > 0.08) G.roots = makeRoots(shape.front);
        G.skull.visible = G.under.visible = G.hairMesh.visible = G.body.visible = G.neck.visible = true;
        ellipsoidMatrix(G.skull.matrix, hf, shape.a * 0.985, shape.b * 0.985, shape.c * 0.985);
        const pal = hairPalette(t);

        const head = t.m.head, bp = G.body.geometry.attributes.position, bz = hf.O.z;
        for (let c = 0; c < SHOULDER_BINS; c++) {
          const hx = -2 + 4 * c / (SHOULDER_BINS - 1);
          const [x, y] = toScreen(head, hx * head.size, t.hair.shoulders[c] * head.size);
          const [x2, y2] = toScreen(head, hx * head.size, 10 * head.size);
          bp.setXYZ(c * 2, x, y, bz); bp.setXYZ(c * 2 + 1, x2, y2, bz);
        }
        bp.needsUpdate = true;

        simulate(t, hf, shape, dt, time, bz);
        const pts = G.pts, depthShade = G.shade;
        const shadeAt = j => {
          const lz = (pts[j * 3] - hf.O.x) * hf.F.x + (pts[j * 3 + 1] - hf.O.y) * hf.F.y + (pts[j * 3 + 2] - hf.O.z) * hf.F.z;
          return 0.7 + 0.3 * Math.max(0, Math.min(1, (lz / shape.c + 1) / 2));
        };

        // The underlayer: two wide, dark ribbons along each guide, fanned slightly apart.
        const up = G.under.geometry.attributes.position.array, uc = G.under.geometry.attributes.color.array;
        const dark = [pal[0], pal[1].map(v => v * 0.85)];
        let under = 0;
        for (const g of G.roots.guides) {
          if (!g.init || g.len < S * 0.01) continue;
          for (let r = 0; r < 2; r++) {
            const spread = (r ? 1 : -1) * 0.012 * S;
            for (let j = 0; j < POINTS; j++) {
              const k = j * 3, along = j / NODES;
              const dx = g.p[Math.min(k + 3, NODES * 3)] - g.p[Math.max(0, k - 3)], dy = g.p[Math.min(k + 4, NODES * 3 + 1)] - g.p[Math.max(1, k - 2)];
              const dl = Math.hypot(dx, dy) || 1;
              pts[k] = g.p[k] - dy / dl * spread * along;
              pts[k + 1] = g.p[k + 1] + dx / dl * spread * along;
              pts[k + 2] = g.p[k + 2];
              depthShade[j] = shadeAt(j);
            }
            writeRibbon(up, uc, under++, pts, POINTS, Math.max(1.5, S * 0.011), dark[r], depthShade);
          }
        }
        G.under.geometry.setDrawRange(0, under * (POINTS - 1) * 6);
        G.under.geometry.attributes.position.needsUpdate = true;
        G.under.geometry.attributes.color.needsUpdate = true;

        // Drawn strands follow their guide, offset to their own root and fanning out a little.
        const pos = G.hairMesh.geometry.attributes.position.array, col = G.hairMesh.geometry.attributes.color.array;
        const halfWidth = Math.max(0.6, S * 0.0026), spreadF = 0.02 + 0.025 * Math.min(1, hair.length / 1.5);
        let drawn = 0;
        const roots = G.roots;
        for (let n = 0; n < count; n++) {
          const s = roots.strands[n], g = roots.guides[s.gi];
          if (!g.init || g.len < S * 0.01) continue;
          // Offset from the guide's root to this strand's, over the head's surface.
          const la = (s.dir.x - g.dir.x) * shape.a * 1.012, lb = (s.dir.y - g.dir.y) * shape.b * 1.012, lc = (s.dir.z - g.dir.z) * shape.c * 1.012;
          const ox = hf.R.x * la + hf.U.x * lb + hf.F.x * lc;
          const oy = hf.R.y * la + hf.U.y * lb + hf.F.y * lc;
          const oz = hf.R.z * la + hf.U.z * lb + hf.F.z * lc;
          const ratio = Math.min(1, s.lengthF / g.lengthF);
          for (let j = 0; j < POINTS; j++) {
            const u = j * ratio, i = Math.min(NODES - 1, Math.floor(u)), f = u - i, k = i * 3;
            const along = j / NODES, keep = 1 - 0.5 * along;
            const ax = g.p[k] + (g.p[k + 3] - g.p[k]) * f, ay = g.p[k + 1] + (g.p[k + 4] - g.p[k + 1]) * f, az = g.p[k + 2] + (g.p[k + 5] - g.p[k + 2]) * f;
            const dx = g.p[k + 3] - g.p[k], dy = g.p[k + 4] - g.p[k + 1], dl = Math.hypot(dx, dy) || 1;
            // Spread and curl sideways (on screen), growing towards the tip.
            const side = (s.spread * spreadF + Math.sin(along * s.curlFreq + s.phase) * s.curl) * S * along;
            pts[j * 3] = ax + ox * keep - dy / dl * side;
            pts[j * 3 + 1] = ay + oy * keep + dx / dl * side;
            pts[j * 3 + 2] = az + oz * keep;
            // Darker the further round the back of the head the strand is.
            depthShade[j] = shadeAt(j);
          }
          writeRibbon(pos, col, drawn++, pts, POINTS, halfWidth, pal[s.shade], depthShade);
        }
        G.hairMesh.geometry.setDrawRange(0, drawn * (POINTS - 1) * 6);
        G.hairMesh.geometry.attributes.position.needsUpdate = true;
        G.hairMesh.geometry.attributes.color.needsUpdate = true;
      }

      drawBeard(t, hf, dt);
    }

    // ---------- Mullet Me ----------
    // Grows the hair out long, then cuts the top, front and sides short and leaves the back
    // long: business in the front, party in the back. A US flag flies across the mirror and a
    // fast bluegrass banjo tune plays (synthesised here, so no audio files are needed).
    const MULLET_SHORT = 0.13;       // face heights left on top, front and sides
    const mullet = { cutAt: Infinity, flagFrom: -Infinity, audio: null };
    hair.mullet = 0;                 // 0 = normal, 1 = fully cut into a mullet

    // How long a strand from this direction on the head should be for the current style.
    function styledLength(d, full, S) {
      if (hair.mullet <= 0) return full;
      // Everything but the back of the head is cut short.
      const front = Math.max(0, Math.min(1, (d.z + 0.35) / 0.3));
      return full + (Math.min(full, MULLET_SHORT * S) - full) * hair.mullet * front;
    }

    $('mulletMe').addEventListener('click', async () => {
      if (!hair.segmenter && !hair.loading) await loadSegmenter();
      if (!hair.segmenter) return;
      hair.mullet = 0;
      hair.target = Math.max(hair.target, 1.6);
      resetHair.hidden = false;
      const now = performance.now();
      mullet.cutAt = now + 1600;     // let it grow out first, then the barber gets to work
      mullet.flagFrom = now + 1200;
      playBanjo();
    });

    function updateMullet(now) {
      if (now >= mullet.cutAt) hair.mullet = Math.min(1, (now - mullet.cutAt) / 900);
    }

    // The flag: drawn once, then drawn in thin slices each frame, each slice shifted and shaded
    // by a travelling wave so it ripples as it flies across.
    const flagCanvas = $('flagCanvas'), flagCtx = flagCanvas.getContext('2d');
    const flagImage = (() => {
      const W = 494, H = 260, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d');
      for (let i = 0; i < 13; i++) { g.fillStyle = i % 2 ? '#ffffff' : '#b22234'; g.fillRect(0, i * H / 13, W, H / 13 + 1); }
      const cw = W * 0.4, ch = H * 7 / 13;
      g.fillStyle = '#3c3b6e'; g.fillRect(0, 0, cw, ch);
      g.fillStyle = '#ffffff';
      const star = (x, y, r) => {
        g.beginPath();
        for (let k = 0; k < 10; k++) {
          const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.4 : r;
          g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        g.fill();
      };
      // 50 stars: rows of six and five.
      for (let row = 0; row < 9; row++) {
        const n = row % 2 ? 5 : 6;
        for (let k = 0; k < n; k++) star(cw / 12 * (2 * k + 1 + (row % 2)), ch / 10 * (row + 1), ch * 0.055);
      }
      return c;
    })();

    function drawFlag(now) {
      const t = (now - mullet.flagFrom) / 1000, dur = 5.5;
      const glassBox = flagCanvas.getBoundingClientRect();
      const w = Math.round(glassBox.width), h = Math.round(glassBox.height);
      if (flagCanvas.width !== w || flagCanvas.height !== h) { flagCanvas.width = w; flagCanvas.height = h; }
      flagCtx.clearRect(0, 0, w, h);
      if (t < 0 || t > dur) return;
      const fw = Math.min(w * 0.55, 520), fh = fw * 260 / 494;
      // Fly in from the left, across the top of the mirror, and out to the right.
      const x0 = -fw + (w + fw) * (t / dur), y0 = h * 0.06;
      const slice = 4, amp = fh * 0.06;
      for (let x = 0; x < fw; x += slice) {
        const phase = x / fw * Math.PI * 3 - t * 9;
        // The wave grows away from the flagpole side, like cloth.
        const k = x / fw, dy = Math.sin(phase) * amp * k;
        flagCtx.globalAlpha = 0.92;
        flagCtx.drawImage(flagImage, x / fw * 494, 0, slice / fw * 494 + 0.5, 260, x0 + x, y0 + dy, slice + 0.5, fh);
        // Shade the folds.
        const shade = Math.cos(phase) * 0.22 * k;
        flagCtx.globalAlpha = Math.abs(shade);
        flagCtx.fillStyle = shade > 0 ? '#ffffff' : '#000000';
        flagCtx.fillRect(x0 + x, y0 + dy, slice + 0.5, fh);
      }
      // The pole.
      flagCtx.globalAlpha = 1;
      flagCtx.fillStyle = '#c9a25a';
      flagCtx.fillRect(x0 - 6, y0 - 8, 6, fh * 1.6);
      flagCtx.beginPath(); flagCtx.arc(x0 - 3, y0 - 10, 7, 0, Math.PI * 2); flagCtx.fill();
    }

    // Banjo: each note is a plucked string (Karplus–Strong synthesis), played in fast forward
    // rolls over G, C and D with a bouncing bass, bluegrass style.
    function pluck(ctx, freq, bright) {
      const sr = ctx.sampleRate, len = Math.floor(sr * 0.9), buf = ctx.createBuffer(1, len, sr);
      const out = buf.getChannelData(0), N = Math.max(2, Math.round(sr / freq));
      const line = new Float32Array(N);
      for (let i = 0; i < N; i++) line[i] = Math.random() * 2 - 1;
      let idx = 0, prev = 0;
      for (let i = 0; i < len; i++) {
        const v = line[idx];
        // Averaging neighbours damps the string; a banjo's bright, quick decay.
        const next = (v * (0.5 + bright) + prev * (0.5 - bright)) * 0.994;
        prev = v;
        line[idx] = next;
        out[i] = v;
        idx = (idx + 1) % N;
      }
      return buf;
    }

    function playBanjo() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (mullet.audio) { mullet.audio.close(); mullet.audio = null; }
        const ctx = new AC();
        mullet.audio = ctx;
        const master = ctx.createGain();
        master.gain.value = 0.55;
        // A banjo's twang: cut the lows, lift the upper mids.
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 160;
        const peak = ctx.createBiquadFilter(); peak.type = 'peaking'; peak.frequency.value = 2400; peak.gain.value = 6;
        master.connect(hp).connect(peak).connect(ctx.destination);
        const cache = new Map();
        const note = (f, at, gain, bright = 0.42) => {
          const key = f + ':' + bright;
          if (!cache.has(key)) cache.set(key, pluck(ctx, f, bright));
          const src = ctx.createBufferSource(), g = ctx.createGain();
          src.buffer = cache.get(key); g.gain.value = gain;
          src.connect(g).connect(master);
          src.start(at);
        };
        const G3 = 196, B3 = 246.94, D4 = 293.66, G4 = 392, C4 = 261.63, E4 = 329.63, Fs4 = 369.99, A4 = 440, B4 = 493.88;
        const chords = {
          G: { roll: [G3, B3, D4, B4], bass: [98, 146.83] },
          C: { roll: [C4, E4, G4, E4], bass: [130.81, 196] },
          D: { roll: [D4, Fs4, A4, Fs4], bass: [146.83, 220] }
        };
        const bars = ['G', 'G', 'C', 'G', 'D', 'D', 'G', 'G', 'G', 'C', 'G', 'D', 'G', 'D', 'G', 'G'];
        const eighth = 60 / 172 / 2, start = ctx.currentTime + 0.05;
        // Forward roll: index, middle and thumb (the high G drone string) around the chord.
        const roll = [0, 1, 4, 2, 3, 4, 1, 2];
        bars.forEach((name, bar) => {
          const c = chords[name];
          roll.forEach((r, i) => {
            const at = start + (bar * 8 + i) * eighth;
            note(r === 4 ? G4 : c.roll[r], at, r === 4 ? 0.28 : 0.4);
          });
          // Boom-chick bass on the beats: root, then fifth.
          for (let beat = 0; beat < 4; beat++) note(c.bass[beat % 2], start + (bar * 8 + beat * 2) * eighth, 0.32, 0.3);
        });
        // Finish on a big G chord, then fade out.
        const end = start + bars.length * 8 * eighth;
        [G3, B3, D4, G4, B4].forEach((f, i) => note(f, end + i * 0.03, 0.4));
        master.gain.setValueAtTime(0.55, end + 0.4);
        master.gain.linearRampToValueAtTime(0, end + 1.6);
        setTimeout(() => { if (mullet.audio === ctx) { ctx.close(); mullet.audio = null; } }, (end - ctx.currentTime + 2) * 1000);
      } catch {
        // No sound available: the mullet still happens.
      }
    }

    // ---------- Dye ----------
    // Natural keeps each person's own colours; any other dye replaces them, for hair and beard,
    // with six shades from dark to light so it keeps its depth and highlights.
    const DYES = [
      ['Natural', null], ['Jet black', '#141112'], ['Brown', '#5b3a22'], ['Auburn', '#7c2f1c'],
      ['Ginger', '#b5561f'], ['Blonde', '#d7b36a'], ['Platinum', '#e8e2d4'], ['Pink', '#e0679c'],
      ['Blue', '#2f6fd6'], ['Green', '#2f9c62'], ['Purple', '#8a3fd1']
    ];
    let dye = null; // null means natural

    function dyePalette(hex) {
      const [r, g, b] = hexRgb(hex);
      return [0.42, 0.58, 0.74, 0.9, 1.05, 1.22].map(k => {
        // Lighter shades also move a little towards white, so pale dyes still have highlights.
        const lift = Math.max(0, k - 1) * 0.5;
        const c = v => Math.round(Math.min(1, v * k + lift * (1 - v)) * 255);
        return `rgb(${c(r)},${c(g)},${c(b)})`;
      });
    }
    let dyed = null;
    const dyeDot = $('dyeDot'), swatches = $('swatches'), dyeCustom = $('dyeCustom');

    function setDye(hex) {
      dye = hex;
      dyed = hex ? dyePalette(hex) : null;
      dyeDot.style.background = hex || '';
      for (const b of swatches.children) b.setAttribute('aria-checked', String(b.dataset.hex === (hex || '')));
    }
    for (const [name, hex] of DYES) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.setAttribute('role', 'radio');
      b.dataset.hex = hex || '';
      b.innerHTML = `<i style="background:${hex || 'conic-gradient(#2a1d15, #7a4a2a, #c9a25a, #2a1d15)'}"></i>${name}`;
      b.addEventListener('click', () => setDye(hex));
      swatches.append(b);
    }
    dyeCustom.addEventListener('input', () => setDye(dyeCustom.value));
    setDye(null);

    // The colours to draw someone's hair and beard in.
    const hairPalette = t => (dyed || t.hair.palette).map(hexRgb);
    const beardPalette = t => (dyed || (t.hair.ready ? t.hair.palette : t.beardPalette)).map(hexRgb);

    // ---------- Beard ----------
    // Strands rooted between the jaw and the mouth (with sideburns at the ears), plus a moustache
    // from the upper lip, in 3D on the face, in each person's own colour. Each press grows it
    // longer. Guide strands carry the physics: a short beard keeps its shape, and the longer it
    // grows the more it hangs and swings under its own weight.
    const JAW = [234, 93, 132, 58, 172, 136, 150, 149, 176, 148, 152, 377, 400, 378, 379, 365, 397, 288, 361, 323, 454];
    const UPPER_LIP = [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291];
    const LIPS = [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185];
    const NOSE_BASE = 2;
    const BEARD_STEP = 0.12;         // face heights added per press
    const BEARD_NODES = 6, BEARD_POINTS = BEARD_NODES + 1;
    const BEARD_GUIDES = MOBILE ? 40 : 80;
    const beard = { length: 0, target: 0, sampler: document.createElement('canvas') };

    const BEARD_STRANDS = (() => {
      const rnd = random(99);
      return Array.from({ length: MOBILE ? 900 : 2400 }, (_, n) => ({
        moustache: n % 6 === 0,
        t: rnd(),                                  // across the jaw or lip, 0..1
        d: Math.pow(rnd(), 0.8) * 1.08 - 0.08,     // from just below the jaw (0) up to the mouth (1)
        lengthF: 0.6 + rnd() * 0.55,
        shade: Math.min(5, Math.floor(Math.pow(rnd(), 1.4) * 6)),
        curl: (rnd() - 0.5) * 1.4,
        phase: rnd() * Math.PI * 2
      }));
    })();
    // Guides are an even spread of the beard strands; every other beard strand follows the
    // guide nearest to it on the jaw.
    const BEARD_GUIDE_STRANDS = (() => {
      const jaw = BEARD_STRANDS.filter(b => !b.moustache);
      const guides = Array.from({ length: BEARD_GUIDES }, (_, i) => jaw[Math.floor(i * jaw.length / BEARD_GUIDES)]);
      for (const b of jaw) {
        let best = 0, bd = Infinity;
        guides.forEach((g, i) => { const d = (g.t - b.t) ** 2 * 4 + (g.d - b.d) ** 2; if (d < bd) { bd = d; best = i; } });
        b.gi = best;
      }
      return guides;
    })();

    growBeard.addEventListener('click', () => {
      beard.target += BEARD_STEP;
      shaveBeard.hidden = false;
    });
    shaveBeard.addEventListener('click', () => {
      beard.target = 0;
      shaveBeard.hidden = true;
    });

    // A point partway along a polyline of landmarks, in 3D.
    function along(face, idx, f) {
      const u = Math.max(0, Math.min(1, f)) * (idx.length - 1), i = Math.min(idx.length - 2, Math.floor(u)), k = u - i;
      const a = face[idx[i]], b = face[idx[i + 1]];
      return v3(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k, a.z + (b.z - a.z) * k);
    }

    // Is (x, y) inside the polygon? pts is a flat [x0, y0, x1, y1, ...] array.
    function insidePolygon(pts, x, y) {
      let inside = false;
      for (let i = 0, j = pts.length - 2; i < pts.length; j = i, i += 2) {
        const xi = pts[i], yi = pts[i + 1], xj = pts[j], yj = pts[j + 1];
