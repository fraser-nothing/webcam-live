<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Webcam Live</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; height: 100dvh; background: #000; color: #eee; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; overflow: hidden; }
    video { display: none; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
    #status { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
    #status[hidden] { display: none; }
    button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; cursor: pointer; }
    button:hover { background: #333; }
    button:disabled { opacity: .6; cursor: default; }
    #controls { position: fixed; z-index: 20; left: 16px; bottom: 16px; right: 16px; width: fit-content; max-width: calc(100% - 32px); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; padding: 10px 14px; border-radius: 10px; background: rgba(0,0,0,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 13px; }
    #controls span { opacity: .7; }
    #controls label { display: flex; align-items: center; gap: 8px; }
    #controls button { padding: 5px 12px; font-size: 13px; }
    #toggleControls { display: none; }
    #face { position: fixed; z-index: 20; top: max(16px, env(safe-area-inset-top)); left: 16px; font-size: 13px; padding: 4px 10px; border-radius: 6px; background: rgba(0,0,0,.55); }
    @media (max-width: 700px) {
      /* Fill the phone screen rather than letterboxing. */
      canvas { object-fit: cover; }
      #controls { left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); width: auto; max-width: none;
                  gap: 10px 16px; padding: 12px; font-size: 14px; }
      #controls input[type=checkbox] { width: 20px; height: 20px; margin: 0; }
      /* Sliders get a full row each so they're easy to drag. */
      #controls label:has(input[type=range]) { flex: 1 1 100%; }
      #controls input[type=range] { flex: 1; }
      #controls button { padding: 9px 14px; font-size: 14px; flex: 1; }
      #toggleControls { display: block; flex: 1 1 100%; }
      #controls.collapsed { gap: 0; padding: 6px; }
      #controls.collapsed > :not(#toggleControls) { display: none; }
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <canvas id="hairCanvas"></canvas>
  <div id="face" hidden>Looking for faces…</div>
  <div id="controls">
    <span>Pulse:</span>
    <label><input id="pulseEyes" type="checkbox"> Eyes</label>
    <label><input id="pulseNose" type="checkbox"> Nose</label>
    <label><input id="pulseMouth" type="checkbox"> Mouth</label>
    <label><input id="browWobble" type="checkbox"> Eyebrow wave</label>
    <label>Wave speed <input id="waveSpeed" type="range" min="0.05" max="1.5" step="0.05" value="0.35"></label>
    <label>Speed <input id="speed" type="range" min="0.2" max="4" step="0.1" value="1.2"></label>
    <label>Size <input id="amount" type="range" min="0" max="1" step="0.01" value="0.6"></label>
    <button id="growHair" type="button">Grow hair</button>
    <button id="resetHair" type="button" hidden>Reset hair</button>
    <button id="toggleControls" type="button">Hide controls</button>
  </div>
  <div id="status">
    <p id="message">Requesting camera access…</p>
    <button id="retry" hidden>Try again</button>
  </div>

  <script type="module">
    import { FaceLandmarker, ImageSegmenter, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

    const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm';
    const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
    // Segments each pixel into background, hair, body skin, face skin, clothes, other.
    const SEGMENT_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite';
    const HAIR_CATEGORY = 1, BODY_SKIN = 2, CLOTHES = 4;

    const $ = id => document.getElementById(id);
    const video = $('video'), canvas = $('canvas'), hairCanvas = $('hairCanvas');
    const status = $('status'), message = $('message'), retry = $('retry'), faceBadge = $('face');
    const speed = $('speed'), amount = $('amount');
    const pulseEyes = $('pulseEyes'), pulseNose = $('pulseNose'), pulseMouth = $('pulseMouth');
    const browWobble = $('browWobble'), waveSpeed = $('waveSpeed'), growHair = $('growHair'), resetHair = $('resetHair');

    // Phones get a lighter load: fewer people, fewer hair strands and a smaller camera feed.
    const MOBILE = matchMedia('(max-width: 700px), (pointer: coarse)').matches;
    const MAX_FACES = MOBILE ? 3 : 4; // the shader's arrays are sized for 4

    const controls = $('controls'), toggleControls = $('toggleControls');
    toggleControls.addEventListener('click', () => {
      const collapsed = controls.classList.toggle('collapsed');
      toggleControls.textContent = collapsed ? 'Show controls' : 'Hide controls';
    });

    // Browsers restore form state on reload; always start from the defaults in the HTML.
    for (const input of document.querySelectorAll('#controls input')) {
      input.checked = input.defaultChecked;
      input.value = input.defaultValue;
    }

    // Landmark indices from MediaPipe's 478-point face mesh.
    const EYES = [
      { centre: [468, 468], width: [33, 133], size: 1.1 },
      { centre: [473, 473], width: [362, 263], size: 1.1 }
    ];
    const NOSE = { centre: [1, 4], width: [129, 358], size: 1.0 };
    const MOUTH = { centre: [13, 14], width: [61, 291], size: 0.8 };
    // Each brow as [upper, lower] landmark pairs at its outer end, arch and inner end.
    const BROWS = [
      { outer: [70, 46], mid: [105, 52], inner: [107, 55] },
      { outer: [300, 276], mid: [334, 282], inner: [336, 285] }
    ];
    const FACE_OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377,
                       152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
    const FOREHEAD = 10, CHIN = 152;

    // ---------- WebGL: draw the video with the face warps ----------
    const gl = canvas.getContext('webgl', { premultipliedAlpha: false });

    const vertSrc = `
      attribute vec2 a;
      varying vec2 vUv;
      void main() {
        vUv = vec2(a.x * 0.5 + 0.5, 0.5 - a.y * 0.5); // top-left origin, same as landmarks
        gl_Position = vec4(a, 0.0, 1.0);
      }`;

    // All positions are in video pixels. Data is packed into vec4s to stay within the uniform
    // limits of phone GPUs. Up to 4 faces: 4 pulse regions and 2 brows each.
    const fragSrc = `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D tex;
      uniform vec2 res;
      uniform float scale;        // pulse: >1 enlarges, <1 shrinks
      uniform vec4 pulse[16];     // xy centre, z radius (0 = off)
      uniform vec4 browEnds[8];   // xy outer end, zw inner end
      uniform vec4 browMid[8];    // xy middle of the arch, z half thickness, w lift in pixels (0 = off)
      uniform vec4 browFace[8];   // xy the face's "down", zw the point between its brows
      uniform float browSpan[8];  // from between the brows to a brow's outer end
      uniform float waveAt;       // where the wave is, -1 (one outer end) to 1 (the other)

      // Magnify or pinch around c, easing back to no change at radius r so there is no seam.
      vec2 pulseAt(vec2 p, vec4 region) {
        float r = region.z;
        vec2 d = p - region.xy;
        float dist = length(d) / r;
        if (r <= 0.0 || dist >= 1.0) return p;
        return region.xy + d * mix(1.0 / scale, 1.0, smoothstep(0.0, 1.0, dist));
      }

      // Lift the brows with a "Mexican wave" that travels from one brow across to the other:
      // whichever part of a brow the wave is passing lifts up, then settles as it moves on.
      // The brow's arch is modelled as a parabola through its ends and middle; the lift fades
      // out away from it and past its ends, gently enough that the image never folds.
      vec2 browAt(vec2 p, vec4 ends, vec4 mid, vec4 face, float span) {
        float th = mid.z, amp = mid.w;
        if (amp <= 0.0 || th <= 0.0) return p;
        vec2 a = ends.xy, b = ends.zw, down = face.xy, right = vec2(down.y, -down.x);
        vec2 ab = b - a;
        float t = dot(p - a, ab) / dot(ab, ab);
        float along = smoothstep(-0.25, 0.05, t) * (1.0 - smoothstep(0.95, 1.25, t));
        if (along <= 0.0) return p;
        float arch = dot(mid.xy - (a + b) * 0.5, down);
        float curveY = dot(ab * t, down) + 4.0 * t * (1.0 - t) * arch;
        float y = dot(p - a, down);
        // Fading over at least 2.2x the lift keeps the stretch gentle enough never to fold.
        float across = 1.0 - smoothstep(th, th + max(th * 6.0, amp * 2.2), abs(y - curveY));
        float pos = dot(p - face.zw, right) / span;
        float lift = exp(-pow(pos - waveAt, 2.0) / 0.18);
        return p + down * (amp * lift * along * across);
      }

      void main() {
        vec2 p = vUv * res;
        for (int i = 0; i < 16; i++) p = pulseAt(p, pulse[i]);
        for (int i = 0; i < 8; i++) p = browAt(p, browEnds[i], browMid[i], browFace[i], browSpan[i]);
        gl_FragColor = texture2D(tex, p / res);
      }`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const aLoc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(aLoc);
    gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    const uniforms = {};
    for (const name of ['res', 'scale', 'pulse', 'browEnds', 'browMid', 'browFace', 'browSpan', 'waveAt']) {
      uniforms[name] = gl.getUniformLocation(prog, name);
    }

    // ---------- Face tracking ----------
    // Each person on screen is a "track" that is matched to the nearest face every frame, so
    // smoothing, hair outline and hair colour stay with the right person.
    let landmarker = null;
    let lastVideoTime = -1;
    let tracks = [];
    let nextTrackId = 1;

    async function createTask(Task, options) {
      const fileset = await FilesetResolver.forVisionTasks(WASM);
      try {
        return await Task.createFromOptions(fileset, { ...options, baseOptions: { ...options.baseOptions, delegate: 'GPU' } });
      } catch {
        return await Task.createFromOptions(fileset, { ...options, baseOptions: { ...options.baseOptions, delegate: 'CPU' } });
      }
    }

    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function measureFeature(face, feature) {
      const c = mid(face[feature.centre[0]], face[feature.centre[1]]);
      return { x: c.x, y: c.y, r: dist(face[feature.width[0]], face[feature.width[1]]) * feature.size };
    }

    function measureBrow(face, b) {
      const [o, m, i] = [b.outer, b.mid, b.inner].map(([up, low]) => mid(face[up], face[low]));
      return { ax: o.x, ay: o.y, mx: m.x, my: m.y, bx: i.x, by: i.y, th: dist(face[b.mid[0]], face[b.mid[1]]) / 2 };
    }

    function measureHead(face) {
      const top = face[FOREHEAD], chin = face[CHIN];
      const size = dist(top, chin);
      return {
        // A little above the middle of the face, roughly the centre of the skull.
        cx: chin.x + (top.x - chin.x) * 0.62, cy: chin.y + (top.y - chin.y) * 0.62,
        ux: (top.x - chin.x) / size, uy: (top.y - chin.y) / size, // "up" the face
        size
      };
    }

    function measure(face) {
      return {
        eyes: EYES.map(e => measureFeature(face, e)),
        nose: measureFeature(face, NOSE),
        mouth: measureFeature(face, MOUTH),
        brows: BROWS.map(b => measureBrow(face, b)),
        head: measureHead(face)
      };
    }

    // Light smoothing to take the jitter out of the landmarks.
    function smoothInto(target, m, t) {
      for (const k in m) {
        if (typeof m[k] === 'object') smoothInto(target[k], m[k], t);
        else target[k] += (m[k] - target[k]) * t;
      }
    }

    function track(w, h) {
      if (!landmarker || video.currentTime === lastVideoTime) return false;
      lastVideoTime = video.currentTime;

      const faces = landmarker.detectForVideo(video, performance.now()).faceLandmarks
        .map(raw => raw.map(p => ({ x: p.x * w, y: p.y * h })));
      const found = faces.map(face => ({ face, m: measure(face) }));
      faceBadge.hidden = found.length > 0;

      // Match each existing person to the nearest new face, closest pairs first.
      const pairs = [];
      tracks.forEach(t => found.forEach(f => {
        const d = Math.hypot(t.m.head.cx - f.m.head.cx, t.m.head.cy - f.m.head.cy);
        if (d < t.m.head.size * 0.7) pairs.push({ t, f, d });
      }));
      pairs.sort((a, b) => a.d - b.d);
      const usedTracks = new Set(), usedFaces = new Set();
      for (const { t, f } of pairs) {
        if (usedTracks.has(t) || usedFaces.has(f)) continue;
        usedTracks.add(t); usedFaces.add(f);
        smoothInto(t.m, f.m, 0.5);
        t.face = f.face;
        t.fade += (1 - t.fade) * 0.3;
      }
      // People who have gone fade out; new faces start new tracks.
      for (const t of tracks) if (!usedTracks.has(t)) { t.fade *= 0.8; t.face = null; }
      tracks = tracks.filter(t => t.fade > 0.02);
      for (const f of found) {
        if (usedFaces.has(f) || tracks.length >= MAX_FACES) continue;
        tracks.push({ id: nextTrackId++, m: f.m, face: f.face, fade: 0.3, hair: newHairState() });
      }
      return true;
    }

    // ---------- Hair ----------
    // Strands grow across each person's scalp, from their hairline back over the top of their
    // head, then fall past the outline of their real hair (found with MediaPipe's segmenter).
    // The part on the scalp is fixed to the head; the part that hangs free is simulated:
    // guide strands are chains of points with momentum and gravity that collide with the
    // person's skull and the outline of their face, and the drawn strands follow the guides.
    const hairCtx = hairCanvas.getContext('2d');
    const BINS = 72;                 // directions around the head used to trace outlines
    const MAX_ANGLE = 1.95;          // radians either side of straight up (~112°)
    const LOCKS = MOBILE ? 140 : 280; // simulated guide strands per person
    const NODES = 8;                 // segments per guide strand
    const ITERATIONS = MOBILE ? 3 : 4; // constraint passes per frame
    const STRAND_BUDGET = MOBILE ? 1600 : 5000; // drawn strands, shared between everyone
    const SHOULDER_BINS = 41;        // columns across the body, 2 face heights either side
    const HAIR_SCALE = MOBILE ? 0.6 : 1; // hair is drawn at this fraction of the video's size
    const GRAVITY = 3.2;             // face heights per second²
    // The scalp part is drawn once into a cached image that follows the head; it's only
    // redrawn when the hair grows or its outline changes, and at most this often (ms).
    const REBUILD_MS = MOBILE ? 700 : 300;
    const GROWING_REBUILD_MS = MOBILE ? 140 : 60;
    const MAX_SPRITE = MOBILE ? 1024 : 2048; // largest cached scalp image, in pixels
    const GROW_STEP = 0.3;           // face heights added per press

    const hair = {
      segmenter: null,
      loading: false,
      length: 0,                     // current length in face heights (animates towards target)
      target: 0,
      frame: 0,
      analyses: 0,
      sampler: document.createElement('canvas')
    };

    function newHairState() {
      return {
        ready: false,
        updatedAt: 0,
        sprite: null,
        guides: null,
        last: null,                                  // head centre last frame, to spot jumps
        outline: new Float32Array(BINS).fill(0.62),  // head centre to the edge of their hair
        hairline: new Float32Array(BINS).fill(0.5),  // head centre to where their hair starts
        // How far below the head's centre their neck and shoulders start, in face heights,
        // across the body. Hair behind them is hidden. Starts as a typical shape.
        shoulders: Float32Array.from({ length: SHOULDER_BINS }, (_, c) => {
          const x = Math.abs(-2 + 4 * c / (SHOULDER_BINS - 1));
          return x < 0.35 ? 0.72 : 1 + (x - 0.35) * 0.12;
        }),
        palette: ['#2a1d15', '#35251a', '#402d20', '#4d3727', '#5c4331', '#6e533e']
      };
    }

    // Deterministic random numbers so the hairstyle stays the same between frames.
    function random(seed) {
      return () => {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // Strands are grouped into locks that share a guide, curl and length, like real hair.
    const { locks, strands } = (() => {
      const rnd = random(1234);
      const locks = Array.from({ length: LOCKS }, () => {
        const angle = (rnd() * 2 - 1) * MAX_ANGLE;
        return {
          angle,
          side: angle === 0 ? 1 : Math.sign(angle),
          curlAmp: 0.004 + rnd() * 0.016,
          curlFreq: 4 + rnd() * 9,
          phase: rnd() * Math.PI * 2,
          lengthF: 0.8 + rnd() * 0.35,
          stiffness: 0.5 + rnd() * 0.5,
          // About half the locks at the sides fall in front of the shoulders, framing the face;
          // the rest fall behind the shoulders and neck, the way long hair is usually worn.
          front: Math.abs(angle) > 1.0 && rnd() < 0.5
        };
      });
      const strands = Array.from({ length: 5000 }, () => {
        const li = Math.floor(rnd() * locks.length), lock = locks[li];
        return {
          li,
          angle: lock.angle + (rnd() - 0.5) * 0.09,
          depth: Math.pow(rnd(), 0.7),          // 0 = at the hairline, 1 = at the edge of the hair
          lengthF: lock.lengthF * (0.82 + rnd() * 0.3),
          offset: (rnd() - 0.5) * 2,            // spread around its guide
          shade: Math.min(5, Math.floor(Math.pow(rnd(), 1.3) * 6)),
          side: lock.side
        };
      });
      // Shuffle so any prefix of the list is an even spread (fewer strands for more people).
      for (let i = strands.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [strands[i], strands[j]] = [strands[j], strands[i]];
      }
      return { locks, strands };
    })();

    async function loadSegmenter() {
      hair.loading = true;
      growHair.disabled = true;
      growHair.textContent = 'Loading hair…';
      try {
        hair.segmenter = await createTask(ImageSegmenter, {
          baseOptions: { modelAssetPath: SEGMENT_MODEL },
          runningMode: 'VIDEO',
          outputCategoryMask: true,
          outputConfidenceMasks: false
        });
      } catch (err) {
        faceBadge.textContent = `Hair model failed to load: ${err.message}`;
        faceBadge.hidden = false;
      }
      hair.loading = false;
      growHair.disabled = false;
      growHair.textContent = 'Grow hair';
    }

    growHair.addEventListener('click', async () => {
      if (!hair.segmenter && !hair.loading) await loadSegmenter();
      if (!hair.segmenter) return;
      hair.target += GROW_STEP;
      resetHair.hidden = false;
    });

    resetHair.addEventListener('click', () => {
      hair.target = 0;
      resetHair.hidden = true;
    });

    // Head-relative polar coordinates: angle from "up" (positive towards image right) and
    // distance in face heights.
    function toPolar(head, x, y) {
      const dx = x - head.cx, dy = y - head.cy;
      const along = dx * -head.uy + dy * head.ux, up = dx * head.ux + dy * head.uy;
      return { a: Math.atan2(along, up), r: Math.hypot(dx, dy) / head.size };
    }

    function binAngle(i) { return (i / (BINS - 1) * 2 - 1) * MAX_ANGLE; }

    function sampleBins(values, angle) {
      const f = (angle / MAX_ANGLE + 1) / 2 * (BINS - 1);
      const i = Math.max(0, Math.min(BINS - 2, Math.floor(f)));
      const t = Math.max(0, Math.min(1, f - i));
      return values[i] * (1 - t) + values[i + 1] * t;
    }

    // Turn the colours of real hair pixels into six shades, darkest to lightest. The brightest
    // third is dropped: it's usually background or glare showing through at the edges.
    function paletteFrom(colours) {
      colours.sort((p, q) => p[0] - q[0]);
      const core = colours.slice(Math.floor(colours.length * 0.03), Math.ceil(colours.length * 0.67));
      return [0.05, 0.2, 0.38, 0.55, 0.72, 0.9].map(q => {
        const c = Math.floor(q * core.length), band = Math.max(1, Math.floor(core.length * 0.04));
        let r = 0, g = 0, b = 0, n = 0;
        for (let k = Math.max(0, c - band); k < Math.min(core.length, c + band); k++, n++) {
          r += core[k][1]; g += core[k][2]; b += core[k][3];
        }
        return `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;
      });
    }

    // Segment the frame once, then trace each person's hair outline and pick up their colours.
    function analyseHair(w, h) {
      const result = hair.segmenter.segmentForVideo(video, performance.now());
      const mask = result.categoryMask;
      if (!mask) { result.close(); return; }
      const mw = mask.width, mh = mask.height;
      const cats = mask.getAsUint8Array();
      const hairAt = (mx, my) => mx >= 0 && my >= 0 && mx < mw && my < mh && cats[my * mw + mx] === HAIR_CATEGORY;
      const isHair = (x, y) => hairAt(Math.round(x * mw / w), Math.round(y * mh / h));

      // Colours are read from a small copy of the frame; step is how many mask pixels per sample.
      const sampleColours = tracks.some(t => !t.hair.ready) || hair.analyses % 4 === 0;
      const step = Math.max(1, Math.round(mw / 192));
      const sw = Math.ceil(mw / step), sh = Math.ceil(mh / step);
      let px = null;
      if (sampleColours) {
        const s = hair.sampler;
        if (s.width !== sw || s.height !== sh) { s.width = sw; s.height = sh; }
        const sctx = s.getContext('2d', { willReadFrequently: true });
        sctx.drawImage(video, 0, 0, sw, sh);
        px = sctx.getImageData(0, 0, sw, sh).data;
      }
      const pixel = (mx, my) => ((Math.floor(my / step) * sw) + Math.floor(mx / step)) * 4;

      for (const t of tracks) {
        if (!t.face) continue;
        const head = t.m.head, S = head.size, st = t.hair;
        const rx = -head.uy, ry = head.ux;

        // The face's edge in each direction, from the face-oval landmarks.
        const oval = FACE_OVAL.map(j => toPolar(head, t.face[j].x, t.face[j].y)).sort((p, q) => p.a - q.a);
        const hairline = new Float32Array(BINS);
        for (let i = 0; i < BINS; i++) {
          const a = binAngle(i);
          let k = oval.findIndex(o => o.a >= a);
          if (k <= 0) k = k === 0 ? 1 : oval.length - 1;
          const p = oval[k - 1], q = oval[k], f = Math.max(0, Math.min(1, (a - p.a) / ((q.a - p.a) || 1)));
          hairline[i] = p.r + (q.r - p.r) * f;
        }

        // March outwards from the edge of the face in each direction. Where their real hair
        // starts is the hairline the new hair roots from; the last hair pixel before a clear
        // run of non-hair is its outer edge. Only hair close to the face counts, so someone
        // else's hair nearby isn't mistaken for theirs.
        const start = new Float32Array(BINS), traced = new Float32Array(BINS);
        for (let i = 0; i < BINS; i++) {
          const a = binAngle(i), face = hairline[i];
          const dx = Math.cos(a) * head.ux + Math.sin(a) * rx, dy = Math.cos(a) * head.uy + Math.sin(a) * ry;
          let first = 0, edge = 0, misses = 0;
          for (let r = face * 0.9; r < face + 0.7; r += 0.012) {
            if (isHair(head.cx + dx * r * S, head.cy + dy * r * S)) {
              if (!first) first = r;
              edge = r; misses = 0;
            } else if (edge ? ++misses > 8 : r > face + 0.2) break;
          }
          // No hair that way (bald patch, or beside the face): grow from just past the face's edge.
          start[i] = first ? Math.max(first, face) : face + 0.04;
          traced[i] = edge ? Math.max(edge, start[i]) : start[i];
        }
        // Smooth across neighbouring directions, then over time.
        const blur = (v, i) => {
          let sum = 0, n = 0;
          for (let k = -2; k <= 2; k++) if (i + k >= 0 && i + k < BINS) { sum += v[i + k]; n++; }
          return sum / n;
        };
        for (let i = 0; i < BINS; i++) {
          const o = blur(traced, i), l = blur(start, i);
          st.outline[i] = st.ready ? st.outline[i] + (o - st.outline[i]) * 0.35 : o;
          st.hairline[i] = st.ready ? st.hairline[i] + (l - st.hairline[i]) * 0.35 : l;
        }

        // This person's own hair colours: only hair pixels near their head and well inside the
        // hair, so the background at its edge and other people's hair don't leak in.
        if (px) {
          const colours = [];
          const x0 = Math.max(1, Math.floor((head.cx - 1.3 * S) * mw / w)), x1 = Math.min(mw - 2, Math.ceil((head.cx + 1.3 * S) * mw / w));
          const y0 = Math.max(1, Math.floor((head.cy - 1.3 * S) * mh / h)), y1 = Math.min(mh - 2, Math.ceil((head.cy + 1.3 * S) * mh / h));
          for (let my = y0; my <= y1; my += step) {
            for (let mx = x0; mx <= x1; mx += step) {
              if (!(hairAt(mx, my) && hairAt(mx - step, my) && hairAt(mx + step, my) && hairAt(mx, my - step) && hairAt(mx, my + step))) continue;
              const pol = toPolar(head, mx * w / mw, my * h / mh);
              if (pol.r > 1.3 || Math.abs(pol.a) > MAX_ANGLE) continue;
              const i = pixel(mx, my), r = px[i], g = px[i + 1], b = px[i + 2];
              colours.push([0.3 * r + 0.59 * g + 0.11 * b, r, g, b]);
            }
          }
          // Little or no hair to go on (very short or none): use the colour of their eyebrows.
          if (colours.length < 150) {
            for (const b of t.m.brows) {
              for (let k = 0; k <= 12; k++) {
                const f = k / 12, x = b.ax + (b.bx - b.ax) * f, y = b.ay + (b.by - b.ay) * f;
                const mx = Math.round(x * mw / w), my = Math.round(y * mh / h);
                if (mx < 0 || my < 0 || mx >= mw || my >= mh) continue;
                const i = pixel(mx, my), r = px[i], g = px[i + 1], bl = px[i + 2];
                colours.push([0.3 * r + 0.59 * g + 0.11 * bl, r, g, bl]);
              }
            }
          }
          if (colours.length > 20) st.palette = paletteFrom(colours);
        }
        // Trace their neck and shoulders: in each column across the body, the first body-skin
        // or clothing pixel below the chin.
        for (let c = 0; c < SHOULDER_BINS; c++) {
          const hx = -2 + 4 * c / (SHOULDER_BINS - 1);
          for (let d = 0.55; d < 3; d += 0.02) {
            const x = head.cx + (hx * rx - d * head.ux) * S, y = head.cy + (hx * ry - d * head.uy) * S;
            const mx = Math.round(x * mw / w), my = Math.round(y * mh / h);
            if (mx < 0 || my < 0 || mx >= mw || my >= mh) break;
            const cat = cats[my * mw + mx];
            if (cat === BODY_SKIN || cat === CLOTHES) {
              st.shoulders[c] = st.ready ? st.shoulders[c] + (d - st.shoulders[c]) * 0.35 : d;
              break;
            }
          }
        }
        st.ready = true;
        st.updatedAt = performance.now();
      }
      result.close();
      hair.analyses++;
    }

    // Where a strand sits on the head, in face heights: its root, the point where it leaves the
    // scalp at the edge of the hair, and how far it lies along the scalp between them.
    function strandGeometry(st, angle, depth) {
      const edgeR = sampleBins(st.outline, angle), lineR = sampleBins(st.hairline, angle);
      const rootR = lineR + Math.max(0, edgeR - lineR) * depth * 0.97;
      return { rootR, edgeR, scalp: Math.max(0, edgeR - rootR) };
    }

    // Head-local directions for an angle around the head: outwards, and along the scalp
    // away from the crown. Local x is the head's right, local y is down the face.
    const outward = a => [Math.sin(a), -Math.cos(a)];
    const alongScalp = (a, side) => [Math.cos(a) * side, Math.sin(a) * side];

    // Draw the scalp part of one person's hair (roots to the edge of their hair) into ctx in
    // head-local pixels, with a head size of S pixels.
    function buildScalp(ctx, st, S, count) {
      const total = hair.length * S;
      const width = Math.max(0.9, S * 0.0042);
      const paths = st.palette.map(() => new Path2D());
      const volume = new Path2D();
      const STEPS = 6;

      for (let n = 0; n < count; n++) {
        const s = strands[n], L = locks[s.li];
        const g = strandGeometry(st, s.angle, s.depth);
        const scalp = Math.min(total * s.lengthF, g.scalp * S);
        if (scalp <= 0) continue;
        const [ox, oy] = outward(s.angle), [tx, ty] = alongScalp(s.angle, s.side);
        let x = ox * g.rootR * S, y = oy * g.rootR * S, px = x, py = y, dx = ox, dy = oy;
        const path = paths[s.shade], vol = n % 2 === 0;
        path.moveTo(x, y);
        if (vol) volume.moveTo(x, y);
        for (let k = 1; k <= STEPS; k++) {
          // Swept back and away from a centre parting, curving round the head as it goes.
          const sweep = 0.35 + 0.55 * k / STEPS;
          dx = ox + tx * sweep; dy = oy + ty * sweep;
          const dl = Math.hypot(dx, dy); dx /= dl; dy /= dl;
          x += dx * scalp / STEPS; y += dy * scalp / STEPS;
          const curl = Math.sin(k / STEPS * L.curlFreq + L.phase) * L.curlAmp * S * 0.25;
          const qx = x - dy * curl, qy = y + dx * curl;
          path.quadraticCurveTo(px, py, (px + qx) / 2, (py + qy) / 2);
          if (vol) volume.quadraticCurveTo(px, py, (px + qx) / 2, (py + qy) / 2);
          px = qx; py = qy;
        }
        path.lineTo(px, py);
        if (vol) volume.lineTo(px, py);
      }
      strokeHair(ctx, st.palette, paths, volume, width, width * 3);
    }

    function strokeHair(ctx, palette, paths, body, width, bodyWidth) {
      const alpha = ctx.globalAlpha;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // A solid underlayer in the mid shades gives the hair its thickness, so it never looks
      // see-through; the strands on top give it texture and cover its edges.
      ctx.globalAlpha = alpha * 0.85;
      ctx.strokeStyle = palette[1];
      ctx.lineWidth = bodyWidth;
      ctx.stroke(body);
      ctx.globalAlpha = alpha * 0.7;
      ctx.strokeStyle = palette[2];
      ctx.lineWidth = bodyWidth * 0.5;
      ctx.stroke(body);
      // Then the individual strands, darkest first so highlights sit on top.
      ctx.globalAlpha = alpha * 0.9;
      paths.forEach((p, i) => {
        ctx.strokeStyle = palette[i];
        ctx.lineWidth = i === 5 ? width * 0.7 : width;
        ctx.stroke(p);
      });
      ctx.globalAlpha = alpha;
    }

    // Redraw a person's cached scalp image at their current head size and hair length.
    function buildSprite(t, count, now) {
      const st = t.hair, S0 = t.m.head.size;
      const reach = 1.5; // face heights from the head's centre; the scalp never goes further
      const q = Math.min(MOBILE ? 0.75 : 1, MAX_SPRITE / (S0 * 2 * reach));
      const S = S0 * q;
      const sprite = st.sprite || { canvas: document.createElement('canvas') };
      const c = sprite.canvas;
      c.width = c.height = Math.ceil(2 * reach * S);
      const ctx = c.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, reach * S, reach * S);
      ctx.globalAlpha = 1;
      buildScalp(ctx, st, S, count);
      Object.assign(sprite, { o: reach * S, S, length: hair.length, builtAt: now });
      st.sprite = sprite;
    }

    // Head-local pixels to screen pixels.
    function toScreen(head, x, y) {
      return [head.cx - x * head.uy - y * head.ux, head.cy + x * head.ux - y * head.uy];
    }

    // Is (x, y) inside the polygon? pts is a flat [x0, y0, x1, y1, ...] array.
    function insidePolygon(pts, x, y) {
      let inside = false;
      for (let i = 0, j = pts.length - 2; i < pts.length; j = i, i += 2) {
        const xi = pts[i], yi = pts[i + 1], xj = pts[j], yj = pts[j + 1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }

    // The nearest point on the polygon's edge to (x, y).
    function nearestOnPolygon(pts, x, y) {
      let best = Infinity, bx = x, by = y;
      for (let i = 0, j = pts.length - 2; i < pts.length; j = i, i += 2) {
        const ax = pts[j], ay = pts[j + 1], ex = pts[i] - ax, ey = pts[i + 1] - ay;
        const f = Math.max(0, Math.min(1, ((x - ax) * ex + (y - ay) * ey) / (ex * ex + ey * ey || 1)));
        const cx = ax + ex * f, cy = ay + ey * f, d = (x - cx) ** 2 + (y - cy) ** 2;
        if (d < best) { best = d; bx = cx; by = cy; }
      }
      return [bx, by];
    }

    // Step the guide strands: each is pinned where it leaves the scalp, carries momentum,
    // falls under gravity and is kept out of the skull and the face.
    function simulate(t, dt, time) {
      const st = t.hair, head = t.m.head, S = head.size;
      const total = hair.length * S;
      const rx = -head.uy, ry = head.ux; // head right, in screen space
      if (!st.guides) st.guides = locks.map(() => ({ p: new Float32Array((NODES + 1) * 2), q: new Float32Array((NODES + 1) * 2), free: 0, init: false }));
      // If the head jumped (tracking caught up, or a new person took over), start fresh.
      const jumped = !st.last || Math.hypot(head.cx - st.last[0], head.cy - st.last[1]) > S * 0.5;
      st.last = [head.cx, head.cy];

      // The face outline, pushed out a touch so hair rests just beside the skin.
      const oval = new Float32Array(FACE_OVAL.length * 2);
      let mx = 0, my = 0;
      FACE_OVAL.forEach(j => { mx += t.face[j].x; my += t.face[j].y; });
      mx /= FACE_OVAL.length; my /= FACE_OVAL.length;
      FACE_OVAL.forEach((j, i) => {
        oval[i * 2] = mx + (t.face[j].x - mx) * 1.04;
        oval[i * 2 + 1] = my + (t.face[j].y - my) * 1.04;
      });
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (let i = 0; i < oval.length; i += 2) {
        x0 = Math.min(x0, oval[i]); x1 = Math.max(x1, oval[i]);
        y0 = Math.min(y0, oval[i + 1]); y1 = Math.max(y1, oval[i + 1]);
      }

      const damping = Math.exp(-dt * 2.5);
      const g = GRAVITY * S * dt * dt;

      locks.forEach((L, li) => {
        const G = st.guides[li];
        const geo = strandGeometry(st, L.angle, 0.5);
        const free = total * L.lengthF - geo.scalp * S;
        G.free = free;
        if (free <= S * 0.01) { G.init = false; return; }
        const seg = free / NODES;
        const [ox, oy] = outward(L.angle), [tx, ty] = alongScalp(L.angle, L.side);
        const [ax, ay] = toScreen(head, ox * geo.edgeR * S, oy * geo.edgeR * S);
        // Leaving the scalp heading along it, only just lifting away, like a real parting.
        const lx = tx * 0.9 + ox * 0.12, ly = ty * 0.9 + oy * 0.12, ll = Math.hypot(lx, ly);
        const dx = (lx * rx - ly * head.ux) / ll, dy = (lx * ry - ly * head.uy) / ll;
        const p = G.p, q = G.q;

        if (!G.init || jumped) {
          for (let i = 0; i <= NODES; i++) {
            p[i * 2] = q[i * 2] = ax + dx * seg * i;
            p[i * 2 + 1] = q[i * 2 + 1] = ay + dy * seg * i;
          }
          G.init = true;
        }
        p[0] = q[0] = ax; p[1] = q[1] = ay;

        // Momentum, gravity and a faint breeze.
        const breeze = Math.sin(time * 0.9 + L.phase) * 0.15 * S * dt * dt;
        for (let i = 1; i <= NODES; i++) {
          const k = i * 2, vx = (p[k] - q[k]) * damping, vy = (p[k + 1] - q[k + 1]) * damping;
          q[k] = p[k]; q[k + 1] = p[k + 1];
          p[k] += vx + breeze;
          p[k + 1] += vy + g;
        }

        for (let it = 0; it < ITERATIONS; it++) {
          // Keep each segment its proper length.
          for (let i = 1; i <= NODES; i++) {
            const k = i * 2, j = k - 2;
            const ex = p[k] - p[j], ey = p[k + 1] - p[j + 1], d = Math.hypot(ex, ey) || 1;
            const diff = (d - seg) / d;
            if (i === 1) { p[k] -= ex * diff; p[k + 1] -= ey * diff; }
            else {
              p[k] -= ex * diff * 0.5; p[k + 1] -= ey * diff * 0.5;
              p[j] += ex * diff * 0.5; p[j + 1] += ey * diff * 0.5;
            }
          }
          // Near the root the hair keeps the direction it leaves the scalp in.
          const k1 = L.stiffness * 0.6, k2 = L.stiffness * 0.25;
          p[2] += (ax + dx * seg - p[2]) * k1; p[3] += (ay + dy * seg - p[3]) * k1;
          p[4] += (p[2] + dx * seg - p[4]) * k2; p[5] += (p[3] + dy * seg - p[5]) * k2;

          for (let i = 1; i <= NODES; i++) {
            const k = i * 2;
            // Out of the skull (the part of the head above its centre)...
            const hx = ((p[k] - head.cx) * rx + (p[k + 1] - head.cy) * ry) / S;
            const hy = ((p[k] - head.cx) * head.ux + (p[k + 1] - head.cy) * head.uy) / S;
            const e = (hx / 0.54) ** 2 + (hy / 0.7) ** 2;
            if (hy > -0.05 && e < 1) {
              const f = 1 / Math.sqrt(e) - 1;
              p[k] += (hx * rx + hy * head.ux) * f * S;
              p[k + 1] += (hx * ry + hy * head.uy) * f * S;
            }
            // ...and out of the face, so it drapes along the cheeks and jaw.
            if (p[k] > x0 && p[k] < x1 && p[k + 1] > y0 && p[k + 1] < y1 && insidePolygon(oval, p[k], p[k + 1])) {
              const [nx, ny] = nearestOnPolygon(oval, p[k], p[k + 1]);
              p[k] = nx; p[k + 1] = ny;
            }
          }
        }
      });
    }

    // Draw the free-hanging part of the front or back locks, each strand following its guide.
    function drawFreeHair(t, count, front) {
      const st = t.hair, head = t.m.head, S = head.size;
      const total = hair.length * S;
      const width = Math.max(0.9, S * 0.0042);
      const paths = st.palette.map(() => new Path2D());
      const body = new Path2D();
      const pts = new Float32Array((NODES + 1) * 2);

      // The solid body follows the guides but stops short of the tips, so the ends stay wispy.
      st.guides.forEach((G, li) => {
        if (G.free <= S * 0.01 || locks[li].front !== front) return;
        body.moveTo(G.p[0], G.p[1]);
        for (let i = 1; i < NODES; i++) body.lineTo(G.p[i * 2], G.p[i * 2 + 1]);
      });

      for (let n = 0; n < count; n++) {
        const s = strands[n], L = locks[s.li], G = st.guides[s.li];
        if (G.free <= S * 0.01 || L.front !== front) continue;
        const geo = strandGeometry(st, s.angle, s.depth);
        const free = total * s.lengthF - geo.scalp * S;
        if (free <= 0) continue;
        const ratio = Math.min(1.25, free / G.free);
        // Where this strand leaves the scalp, relative to its guide.
        const [ox, oy] = outward(s.angle);
        const [ex, ey] = toScreen(head, ox * geo.edgeR * S, oy * geo.edgeR * S);
        const rx0 = ex - G.p[0], ry0 = ey - G.p[1];
        for (let j = 0; j <= NODES; j++) {
          // Walk along the guide (a shorter strand stops partway, a longer one runs on).
          const u = j * ratio, i = Math.min(NODES - 1, Math.floor(u)), f = u - i;
          const ax = G.p[i * 2], ay = G.p[i * 2 + 1], bx = G.p[i * 2 + 2], by = G.p[i * 2 + 3];
          const dx = bx - ax, dy = by - ay, dl = Math.hypot(dx, dy) || 1;
          const along = j / NODES;
          // Spread around the guide and curl, both growing towards the tip.
          const side = s.offset * S * 0.025 * along + Math.sin(along * L.curlFreq + L.phase) * L.curlAmp * S * along;
          pts[j * 2] = ax + dx * f + rx0 * (1 - along * 0.6) - dy / dl * side;
          pts[j * 2 + 1] = ay + dy * f + ry0 * (1 - along * 0.6) + dx / dl * side;
        }
        const path = paths[s.shade];
        path.moveTo(pts[0], pts[1]);
        for (let j = 1; j < NODES; j++) {
          path.quadraticCurveTo(pts[j * 2], pts[j * 2 + 1], (pts[j * 2] + pts[j * 2 + 2]) / 2, (pts[j * 2 + 1] + pts[j * 2 + 3]) / 2);
        }
        path.lineTo(pts[NODES * 2], pts[NODES * 2 + 1]);
      }
      strokeHair(hairCtx, st.palette, paths, body, width, S * 0.028);
    }

    // Hide whatever has been drawn behind a person's neck and shoulders.
    function cutBehindBody(t) {
      const st = t.hair, head = t.m.head, S = head.size;
      const alpha = hairCtx.globalAlpha;
      hairCtx.globalAlpha = 1;
      hairCtx.globalCompositeOperation = 'destination-out';
      hairCtx.beginPath();
      for (let c = 0; c < SHOULDER_BINS; c++) {
        const hx = -2 + 4 * c / (SHOULDER_BINS - 1);
        const [x, y] = toScreen(head, hx * S, st.shoulders[c] * S);
        c ? hairCtx.lineTo(x, y) : hairCtx.moveTo(x, y);
      }
      for (const [x, y] of [[3, st.shoulders[SHOULDER_BINS - 1]], [3, 8], [-3, 8], [-3, st.shoulders[0]]]) {
        hairCtx.lineTo(...toScreen(head, x * S, y * S));
      }
      hairCtx.closePath();
      hairCtx.fill();
      hairCtx.globalCompositeOperation = 'source-over';
      hairCtx.globalAlpha = alpha;
    }

    function drawHair(w, h, now, dt) {
      const cw = Math.round(w * HAIR_SCALE), ch = Math.round(h * HAIR_SCALE);
      if (hairCanvas.width !== cw || hairCanvas.height !== ch) {
        hairCanvas.width = cw;
        hairCanvas.height = ch;
      }
      hairCtx.setTransform(1, 0, 0, 1, 0, 0);
      hairCtx.clearRect(0, 0, cw, ch);
      hair.length += (hair.target - hair.length) * 0.06;
      if (Math.abs(hair.target - hair.length) < 0.002) hair.length = hair.target;
      const people = tracks.filter(t => t.face && t.hair.ready && t.fade > 0.5);
      if (hair.length < 0.005 || !people.length) return;

      // Redraw at most one person's scalp image per frame, and only when it has changed.
      const count = Math.floor(STRAND_BUDGET / people.length);
      const stale = people.filter(t => {
        const sp = t.hair.sprite;
        if (!sp) return true;
        const age = now - sp.builtAt;
        const growing = Math.abs(sp.length - hair.length) > 0.004;
        return (growing && age > GROWING_REBUILD_MS) || (t.hair.updatedAt > sp.builtAt && age > REBUILD_MS);
      });
      if (stale.length) {
        stale.sort((a, b) => (a.hair.sprite?.builtAt ?? 0) - (b.hair.sprite?.builtAt ?? 0));
        buildSprite(stale[0], count, now);
      }

      for (const t of people) {
        simulate(t, dt, now / 1000);
        const sp = t.hair.sprite, head = t.m.head;
        hairCtx.globalAlpha = t.fade;
        // Hair falling behind the shoulders, hidden by the body; then the locks falling in
        // front; then the scalp on top so the roots look continuous.
        hairCtx.setTransform(HAIR_SCALE, 0, 0, HAIR_SCALE, 0, 0);
        drawFreeHair(t, count, false);
        cutBehindBody(t);
        drawFreeHair(t, count, true);
        if (sp) {
          const k = head.size / sp.S * HAIR_SCALE;
          hairCtx.globalAlpha = t.fade;
          hairCtx.setTransform(-head.uy * k, head.ux * k, -head.ux * k, -head.uy * k, head.cx * HAIR_SCALE, head.cy * HAIR_SCALE);
          hairCtx.drawImage(sp.canvas, -sp.o, -sp.o);
        }
      }
      hairCtx.globalAlpha = 1;

      // Tuck the hair behind everyone's faces.
      hairCtx.setTransform(HAIR_SCALE, 0, 0, HAIR_SCALE, 0, 0);
      hairCtx.globalCompositeOperation = 'destination-out';
      hairCtx.beginPath();
      for (const t of people) {
        FACE_OVAL.forEach((j, i) => i ? hairCtx.lineTo(t.face[j].x, t.face[j].y) : hairCtx.moveTo(t.face[j].x, t.face[j].y));
        hairCtx.closePath();
      }
      hairCtx.fill();
      hairCtx.globalCompositeOperation = 'source-over';
      hairCtx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // ---------- Render loop ----------
    // Advanced by elapsed time rather than derived from it, so changing the speed doesn't jump.
    let waveClock = 0, lastNow = performance.now();
    const pulseData = new Float32Array(16 * 4);
    const browEnds = new Float32Array(8 * 4), browMid = new Float32Array(8 * 4);
    const browFace = new Float32Array(8 * 4), browSpan = new Float32Array(8);

    function render(now) {
      const w = video.videoWidth, h = video.videoHeight;
      if (w && h) {
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }

        const fresh = track(w, h);
        // Trace hair quickly until everyone's outline is known, then only now and then.
        const settled = hair.analyses > 4 && tracks.every(t => t.hair.ready);
        const every = settled ? (MOBILE ? 45 : 20) : 4;
        if (fresh && hair.segmenter && hair.target > 0 && tracks.length && hair.frame++ % every === 0) analyseHair(w, h);

        const cycle = now / 1000 * Math.PI * 2 * Number(speed.value);
        // Grows up to (1 + amount) and shrinks down to 1 / (1 + amount).
        const scale = Math.pow(1 + Number(amount.value), Math.sin(cycle));
        // Sweep from just past one outer end to just past the other, then start again.
        // Wave speed is passes per second.
        waveClock = (waveClock + (now - lastNow) / 1000 * Number(waveSpeed.value)) % 1;

        pulseData.fill(0); browEnds.fill(0); browMid.fill(0); browFace.fill(0); browSpan.fill(1);
        tracks.slice(0, 4).forEach((t, f) => {
          const m = t.m;
          const regions = [[pulseEyes, m.eyes[0]], [pulseEyes, m.eyes[1]], [pulseNose, m.nose], [pulseMouth, m.mouth]];
          regions.forEach(([toggle, r], i) => {
            pulseData.set([r.x, r.y, toggle.checked ? r.r * t.fade : 0, 0], (f * 4 + i) * 4);
          });
          const [b0, b1] = m.brows;
          const cx = (b0.ax + b1.ax) / 2, cy = (b0.ay + b1.ay) / 2;
          const span = Math.hypot(b1.ax - b0.ax, b1.ay - b0.ay) / 2 || 1;
          // About 5% of the face height: a clear, cartoonish lift.
          const lift = browWobble.checked ? 0.05 * m.head.size * t.fade : 0;
          m.brows.forEach((b, i) => {
            const k = f * 2 + i;
            browEnds.set([b.ax, b.ay, b.bx, b.by], k * 4);
            browMid.set([b.mx, b.my, b.th, lift], k * 4);
            browFace.set([-m.head.ux, -m.head.uy, cx, cy], k * 4);
            browSpan[k] = span;
          });
        });

        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        gl.uniform2f(uniforms.res, w, h);
        gl.uniform1f(uniforms.scale, scale);
        gl.uniform4fv(uniforms.pulse, pulseData);
        gl.uniform4fv(uniforms.browEnds, browEnds);
        gl.uniform4fv(uniforms.browMid, browMid);
        gl.uniform4fv(uniforms.browFace, browFace);
        gl.uniform1fv(uniforms.browSpan, browSpan);
        gl.uniform1f(uniforms.waveAt, -1.5 + 3 * waveClock);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        drawHair(w, h, now, Math.min(0.05, Math.max(0, (now - lastNow) / 1000)));
      }
      lastNow = now;
      requestAnimationFrame(render);
    }

    // ---------- Camera ----------
    async function start() {
      status.hidden = false;
      retry.hidden = true;
      message.textContent = 'Requesting camera access…';

      if (!navigator.mediaDevices?.getUserMedia) {
        message.textContent = 'This browser does not support camera access. Open this page via http://localhost or https.';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: MOBILE
            ? { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
            : { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        status.hidden = true;
      } catch (err) {
        const reasons = {
          NotAllowedError: 'Camera permission was denied. Allow it in your browser (and in System Settings → Privacy & Security → Camera), then try again.',
          NotFoundError: 'No camera was found.',
          NotReadableError: 'The camera is in use by another app.'
        };
        message.textContent = reasons[err.name] || `Could not start the camera: ${err.message}`;
        retry.hidden = false;
        return;
      }

      if (!landmarker) {
        faceBadge.textContent = 'Loading face tracking…';
        faceBadge.hidden = false;
        try {
          landmarker = await createTask(FaceLandmarker, {
            baseOptions: { modelAssetPath: FACE_MODEL },
            runningMode: 'VIDEO',
            numFaces: MAX_FACES
          });
          faceBadge.textContent = 'Looking for faces…';
        } catch (err) {
          faceBadge.textContent = `Face tracking failed to load: ${err.message}`;
        }
      }
    }

    retry.addEventListener('click', start);
    requestAnimationFrame(render);
    start();
  </script>
</body>
</html>
