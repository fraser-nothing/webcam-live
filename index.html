      t.gfx.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material !== occluderMaterial) o.material.dispose(); });
      t.gfx.guideTex.dispose();
      t.gfx = null;
    }

    const ellipsoidMatrix = (m, hf, a, b, c) => m.set(
      hf.R.x * a, hf.U.x * b, hf.F.x * c, hf.O.x,
      hf.R.y * a, hf.U.y * b, hf.F.y * c, hf.O.y,
      hf.R.z * a, hf.U.z * b, hf.F.z * c, hf.O.z,
      0, 0, 0, 1);

    function updatePerson(t, count, dt, time) {
      if (!t.gfx) makeGfx(t);
      const G = t.gfx, hf = headFrame(t.face, t.rot), S = hf.S;
      const showHair = t.hair.ready && hair.length > 0.005;
      G.group.visible = t.fade > 0.5;

      if (!showHair) { G.skull.visible = G.under.visible = G.hairMesh.visible = false; }
      else {
        const shape = fitShape(t, hf);
        if (!G.roots || Math.abs(G.roots.front - shape.front) > 0.08) {
          G.roots = makeRoots(shape.front);
          G.hairMesh.geometry.dispose(); G.hairMesh.geometry = strandGeometry3(G.roots, false);
          G.under.geometry.dispose(); G.under.geometry = strandGeometry3(G.roots, true);
        }
        G.skull.visible = G.under.visible = G.hairMesh.visible = true;
        // A little inside the hair's surface, so it only hides hair that's really behind the head.
        ellipsoidMatrix(G.skull.matrix, hf, shape.a * 0.9, shape.b * 0.9, shape.c * 0.9);

        simulate(t, hf, shape, dt, time, hf.O.z);

        // Upload the guides: each row a guide's points, with its length in the first point's w.
        const data = G.guideData;
        G.roots.guides.forEach((g, gi) => {
          for (let j = 0; j < POINTS; j++) {
            const o = (gi * POINTS + j) * 4;
            data[o] = g.p[j * 3]; data[o + 1] = g.p[j * 3 + 1]; data[o + 2] = g.p[j * 3 + 2];
            data[o + 3] = j === 0 && g.init ? g.len : 0;
          }
        });
        G.guideTex.needsUpdate = true;

        const u = G.uniforms, pal = hairPalette(t);
        u.hO.value.set(hf.O.x, hf.O.y, hf.O.z); u.hR.value.set(hf.R.x, hf.R.y, hf.R.z);
        u.hU.value.set(hf.U.x, hf.U.y, hf.U.z); u.hF.value.set(hf.F.x, hf.F.y, hf.F.z);
        u.shape.value.set(shape.a, shape.b, shape.c);
        u.S.value = S;
        u.spreadF.value = 0.03 + 0.045 * Math.min(1, hair.length / 1.5);
        u.halfWidth.value = Math.max(1.1, S * 0.0045);
        u.browY.value = toLocal(hf, t.face[FOREHEAD]).y - 0.12 * S;
        u.mullet.value = hair.mullet;
        pal.forEach((c, i) => u.palette.value[i].set(c[0], c[1], c[2]));
        G.hairMesh.geometry.setDrawRange(0, count * (POINTS - 1) * 6);
      }

      drawBeard(t, hf, dt);
    }

    // ---------- Mullet Me ----------
    // Grows the hair out long, then cuts it into a classic mullet: a full top combed forward
    // into a blunt fringe just above the brows, short sides around the ears, and the back left
    // long behind the neck: business in the front, party in the back. Any beard is shaved off.
    // A US flag flies behind the person and a fast bluegrass banjo tune plays (synthesised
    // here, so no audio files are needed).
    const MULLET_TOP = 0.24;         // face heights: top and fringe, reaching just above the brows
    const MULLET_SIDES = 0.1;        // face heights: short around the ears
    const mullet = { cutAt: Infinity, flagFrom: -Infinity, audio: null };
    hair.mullet = 0;                 // 0 = normal, 1 = fully cut into a mullet

    // How long a strand from this direction on the head should be for the current style.
    const clamp01 = v => Math.max(0, Math.min(1, v));

    function styledLength(d, full, S) {
      if (hair.mullet <= 0) return full;
      // The back of the head stays long; the rest is cut.
      const cut = clamp01((d.z + 0.4) / 0.25);
      // Low on the sides, around the ears, it's cut shorter than on top.
      const sides = clamp01((Math.abs(d.x) - 0.5) / 0.3) * clamp01((0.55 - d.y) / 0.3);
      const short = (MULLET_TOP + (MULLET_SIDES - MULLET_TOP) * sides) * S;
      return full + (Math.min(full, short) - full) * hair.mullet * cut;
    }

    const mulletMe = async () => {
      if (!hair.segmenter && !hair.loading) await loadSegmenter();
      if (!hair.segmenter) return;
      hair.mullet = 0;
      hair.target = Math.max(hair.target, 1.05);
      resetHair.hidden = false;
      const now = performance.now();
      mullet.cutAt = now + 1600;     // let it grow out first, then the barber gets to work
      mullet.shaved = false;
      mullet.flagFrom = now + 1200;
      playBanjo();
    };
    for (const b of document.querySelectorAll('.mullet-trigger')) b.addEventListener('click', mulletMe);

    function updateMullet(now) {
      if (now < mullet.cutAt) return;
      hair.mullet = Math.min(1, (now - mullet.cutAt) / 900);
      // The barber shaves off any beard at the same time: a proper mullet is clean-shaven.
      if (!mullet.shaved) {
        mullet.shaved = true;
        beard.target = 0;
        shaveBeard.hidden = true;
      }
    }

    // The flag: drawn once, then drawn in thin slices each frame, each slice shifted and shaded
    // by a travelling wave so it ripples as it flies across.
    const flagCanvas = $('flagCanvas'), flagCtx = flagCanvas.getContext('2d');
    const flagImage = (() => {
      const W = 494, H = 260, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d');
      for (let i = 0; i < 13; i++) { g.fillStyle = i % 2 ? '#ffffff' : '#b22234'; g.fillRect(0, i * H / 13, W, H / 13 + 1); }
      const cw = W * 0.4, ch = H * 7 / 13;
      g.fillStyle = '#3c3b6e'; g.fillRect(0, 0, cw, ch);
      g.fillStyle = '#ffffff';
      const star = (x, y, r) => {
        g.beginPath();
        for (let k = 0; k < 10; k++) {
          const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.4 : r;
          g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        g.fill();
      };
      // 50 stars: rows of six and five.
      for (let row = 0; row < 9; row++) {
        const n = row % 2 ? 5 : 6;
        for (let k = 0; k < n; k++) star(cw / 12 * (2 * k + 1 + (row % 2)), ch / 10 * (row + 1), ch * 0.055);
      }
      return c;
    })();

    // A big flag billowing behind the person: it sweeps in, waves, and sweeps out. The person
    // (from the segmentation) is cut out of it, so it's behind them, and the new hair is drawn
    // on top of it.
    function drawFlag(now) {
      const t = (now - mullet.flagFrom) / 1000, dur = 8;
      const box = flagCanvas.getBoundingClientRect();
      const w = Math.round(box.width), h = Math.round(box.height);
      if (flagCanvas.width !== w || flagCanvas.height !== h) { flagCanvas.width = w; flagCanvas.height = h; }
      flagCtx.clearRect(0, 0, w, h);
      if (t < 0 || t > dur) return;
      const fw = w * 1.05, fh = fw * 260 / 494;
      // Sweep in from the left, hang behind them waving, then sweep out to the right.
      const ease = v => v * v * (3 - 2 * v);
      const inT = ease(clamp01(t / 1.2)), outT = ease(clamp01((t - (dur - 1.2)) / 1.2));
      const x0 = (w - fw) / 2 + (inT - 1) * w * 1.2 + outT * w * 1.2, y0 = h * 0.04;
      const slice = 5, amp = fh * 0.05;
      for (let x = 0; x < fw; x += slice) {
        const k = x / fw, phase = k * Math.PI * 2.6 - t * 5;
        // The wave grows away from the flagpole side, like cloth.
        const dy = Math.sin(phase) * amp * (0.25 + k);
        flagCtx.globalAlpha = 1;
        flagCtx.drawImage(flagImage, k * 494, 0, slice / fw * 494 + 0.5, 260, x0 + x, y0 + dy, slice + 0.6, fh);
        // Shade the folds.
        const shade = Math.cos(phase) * 0.26 * (0.3 + k);
        flagCtx.globalAlpha = Math.min(0.5, Math.abs(shade));
        flagCtx.fillStyle = shade > 0 ? '#ffffff' : '#000000';
        flagCtx.fillRect(x0 + x, y0 + dy, slice + 0.6, fh);
      }
      flagCtx.globalAlpha = 1;
      // Cut the person out, mapped the way the video fills the mirror (covered and mirrored).
      const vw = video.videoWidth, vh = video.videoHeight;
      if (occlusion.person && vw && vh) {
        const sc = Math.max(w / vw, h / vh), dw = vw * sc, dh = vh * sc;
        flagCtx.save();
        flagCtx.globalCompositeOperation = 'destination-out';
        flagCtx.translate(w, 0); flagCtx.scale(-1, 1);

    }

    // Hillbilly breakdown, all synthesised: a banjo in open G picking fast forward rolls, a
    // jug bass going boom-chick, a washboard scratching the off-beats, and a "shave and a
    // haircut, two bits" ending.
    //
    // Banjo notes are plucked strings (Karplus–Strong): a burst of noise, plucked near the
    // bridge (which gives the nasal twang), circulating round a delay line one period long and
    // losing a little each time. Banjos ring bright and die fast, so the loss is small but an
    // envelope cuts them short, and a "drum head" of resonant filters adds the honk.
    function pluck(ctx, freq) {
      const sr = ctx.sampleRate, len = Math.floor(sr * 0.7), buf = ctx.createBuffer(1, len, sr);
      const out = buf.getChannelData(0), N = Math.max(2, Math.round(sr / freq));
      const line = new Float32Array(N), pickAt = Math.max(1, Math.round(N * 0.13));
      const noise = Float32Array.from({ length: N }, () => Math.random() * 2 - 1);
      for (let i = 0; i < N; i++) line[i] = noise[i] - noise[(i + pickAt) % N] * 0.9;
      let idx = 0, prev = 0;
      for (let i = 0; i < len; i++) {
        const v = line[idx];
        line[idx] = (v * 0.9 + prev * 0.1) * 0.998;
        prev = v;
        // Quick attack, fast decay: the banjo's short, punchy ring.
        out[i] = v * Math.exp(-i / (sr * 0.22)) * (i < 40 ? i / 40 : 1);
        idx = (idx + 1) % N;
      }
      return buf;
    }

    function playBanjo() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (mullet.audio) { mullet.audio.close(); mullet.audio = null; }
        const ctx = new AC();
        mullet.audio = ctx;
        const master = ctx.createGain();
        master.gain.value = 0.5;
        const glue = ctx.createDynamicsCompressor();
        glue.threshold.value = -16; glue.ratio.value = 4;
        master.connect(glue).connect(ctx.destination);

        // The banjo's body: a drum head that honks in the upper mids, a bit of grit, no mud.
        const banjo = ctx.createGain();
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 180;
        const head = ctx.createBiquadFilter(); head.type = 'peaking'; head.frequency.value = 1700; head.Q.value = 1.8; head.gain.value = 9;
        const ring = ctx.createBiquadFilter(); ring.type = 'peaking'; ring.frequency.value = 3600; ring.Q.value = 2.5; ring.gain.value = 5;
        const grit = ctx.createWaveShaper();
        grit.curve = Float32Array.from({ length: 1024 }, (_, i) => { const x = i / 511.5 - 1; return Math.tanh(x * 2.2); });
        banjo.connect(hp).connect(head).connect(ring).connect(grit).connect(master);

        const cache = new Map();
        // slide: start a little flat and bend up into the note, the way pickers slide in.
        const note = (f, at, gain, slide = false) => {
          if (!cache.has(f)) cache.set(f, pluck(ctx, f));
          const src = ctx.createBufferSource(), g = ctx.createGain();
          src.buffer = cache.get(f); g.gain.value = gain;
          if (slide) {
            src.playbackRate.setValueAtTime(0.89, at);
            src.playbackRate.linearRampToValueAtTime(1, at + 0.07);
          }
          src.connect(g).connect(banjo);
          src.start(at);
        };
        // Jug bass: a low tone that swoops down into its note ("whoomp").
        const jug = (f, at, gain = 0.5) => {
          const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
          o.type = 'triangle'; lp.type = 'lowpass'; lp.frequency.value = 500;
          o.frequency.setValueAtTime(f * 1.35, at);
          o.frequency.exponentialRampToValueAtTime(f, at + 0.05);
          g.gain.setValueAtTime(0, at);
          g.gain.linearRampToValueAtTime(gain, at + 0.015);
          g.gain.exponentialRampToValueAtTime(0.001, at + 0.28);
          o.connect(lp).connect(g).connect(master);
          o.start(at); o.stop(at + 0.3);
        };
        // Washboard: a short, bright scratch of noise.
        const noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate);
        noiseBuf.getChannelData(0).forEach((_, i, d) => { d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); });
        const scratch = (at, gain = 0.25) => {
          const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
          src.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = 5200; bp.Q.value = 1.2; g.gain.value = gain;
          src.connect(bp).connect(g).connect(master);
          src.start(at);
        };

        // Banjo strings in open G (5th string is the high drone), and fretted notes for chords.
        const n = { D3: 146.83, E3: 164.81, G3: 196, A3: 220, B3: 246.94, C4: 261.63, D4: 293.66, E4: 329.63, Fs4: 369.99, G4: 392, A4: 440, B4: 493.88 };
        // For each chord: the thumb string, index string and melody on the 1st string, bar by bar.
        const shapes = {
          G: { thumb: n.G3, index: n.B3, melody: [n.D4, n.D4, n.E4, n.D4] },
          C: { thumb: n.G3, index: n.C4, melody: [n.E4, n.E4, n.G4, n.E4] },
          D: { thumb: n.A3, index: n.D4, melody: [n.Fs4, n.Fs4, n.A4, n.Fs4] }
        };
        const bass = { G: [98, 146.83], C: [130.81, 196], D: [146.83, 220] };
        const bars = ['G', 'G', 'C', 'G', 'G', 'G', 'D', 'D', 'G', 'G', 'C', 'G', 'D', 'D', 'G', 'G'];
        const eighth = 60 / 232 / 2, start = ctx.currentTime + 0.05;

        bars.forEach((name, bar) => {
          const c = shapes[name], t0 = start + bar * 8 * eighth;
          const m = c.melody[bar % 4];
          // A forward roll: thumb, index, middle, drone, index, middle, drone, middle.
          const roll = [c.thumb, c.index, m, n.G4, c.index, m, n.G4, m];
          roll.forEach((f, i) => {
            const accent = i === 0 || i === 3 ? 0.46 : 0.34;
            note(f, t0 + i * eighth, f === n.G4 ? 0.26 : accent, i === 0 && name !== bars[bar - 1]);
          });
          for (let beat = 0; beat < 4; beat++) {
            jug(bass[name][beat % 2], t0 + beat * 2 * eighth);
            scratch(t0 + (beat * 2 + 1) * eighth, beat % 2 ? 0.3 : 0.22);
          }
        });

        // "Shave and a haircut… two bits!" in G, played on banjo with the band.
        const end = start + bars.length * 8 * eighth, q = eighth * 2;
        const lick = [[n.G4, 0], [n.D4, 2], [n.D4, 3], [n.E4, 4], [n.D4, 6], [n.Fs4, 10], [n.G4, 12]];
        lick.forEach(([f, at], i) => {
          note(f, end + at * eighth, 0.5, i === 0);
          note(f / 2, end + at * eighth, 0.25);
          if (i >= 5) { jug(i === 5 ? 146.83 : 98, end + at * eighth, 0.6); scratch(end + at * eighth, 0.35); }
        });
        const stopAt = end + 12 * eighth + q * 2;
        master.gain.setValueAtTime(0.5, stopAt - 0.3);
        master.gain.linearRampToValueAtTime(0, stopAt + 0.4);
        setTimeout(() => { if (mullet.audio === ctx) { ctx.close(); mullet.audio = null; } }, (stopAt - ctx.currentTime + 1) * 1000);
      } catch {
        // No sound available: the mullet still happens.
      }
    }

    // ---------- Dye ----------
    // Natural keeps each person's own colours; any other dye replaces them, for hair and beard,
    // with six shades from dark to light so it keeps its depth and highlights.
    const DYES = [
      ['Natural', null], ['Jet black', '#141112'], ['Brown', '#5b3a22'], ['Auburn', '#7c2f1c'],
      ['Ginger', '#b5561f'], ['Blonde', '#d7b36a'], ['Platinum', '#e8e2d4'], ['Pink', '#e0679c'],
      ['Blue', '#2f6fd6'], ['Green', '#2f9c62'], ['Purple', '#8a3fd1']
    ];
    let dye = null; // null means natural

    function dyePalette(hex) {
      const [r, g, b] = hexRgb(hex);
      return [0.42, 0.58, 0.74, 0.9, 1.05, 1.22].map(k => {
        // Lighter shades also move a little towards white, so pale dyes still have highlights.
        const lift = Math.max(0, k - 1) * 0.5;
        const c = v => Math.round(Math.min(1, v * k + lift * (1 - v)) * 255);
        return `rgb(${c(r)},${c(g)},${c(b)})`;
      });
    }
    let dyed = null;
    const dyeDot = $('dyeDot'), swatches = $('swatches'), dyeCustom = $('dyeCustom');

    function setDye(hex) {
      dye = hex;
      dyed = hex ? dyePalette(hex) : null;
      dyeDot.style.background = hex || '';
      for (const b of swatches.children) b.setAttribute('aria-checked', String(b.dataset.hex === (hex || '')));
    }
    for (const [name, hex] of DYES) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.setAttribute('role', 'radio');
      b.dataset.hex = hex || '';
      b.innerHTML = `<i style="background:${hex || 'conic-gradient(#2a1d15, #7a4a2a, #c9a25a, #2a1d15)'}"></i>${name}`;
      b.addEventListener('click', () => setDye(hex));
      swatches.append(b);
    }
    dyeCustom.addEventListener('input', () => setDye(dyeCustom.value));
    setDye(null);

    // The colours to draw someone's hair and beard in.
    const hairPalette = t => (dyed || t.hair.palette).map(hexRgb);
    const beardPalette = t => (dyed || (t.hair.ready ? t.hair.palette : t.beardPalette)).map(hexRgb);

    // ---------- Beard ----------
    // Strands rooted between the jaw and the mouth (with sideburns at the ears), plus a moustache
    // from the upper lip, in 3D on the face, in each person's own colour. Each press grows it
    // longer. Guide strands carry the physics: a short beard keeps its shape, and the longer it
    // grows the more it hangs and swings under its own weight.
    const JAW = [234, 93, 132, 58, 172, 136, 150, 149, 176, 148, 152, 377, 400, 378, 379, 365, 397, 288, 361, 323, 454];
    const UPPER_LIP = [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291];
    const LIPS = [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185];
    const NOSE_BASE = 2;
    const BEARD_STEP = 0.12;         // face heights added per press
    const BEARD_NODES = 6, BEARD_POINTS = BEARD_NODES + 1;
    const BEARD_GUIDES = MOBILE ? 40 : 80;
    const beard = { length: 0, target: 0, sampler: document.createElement('canvas') };

    const BEARD_STRANDS = (() => {
      const rnd = random(99);
      return Array.from({ length: MOBILE ? 1200 : 3200 }, (_, n) => ({
        moustache: n % 6 === 0,
        t: rnd(),                                  // across the jaw or lip, 0..1
        d: Math.pow(rnd(), 0.8) * 1.08 - 0.08,     // from just below the jaw (0) up to the mouth (1)
        lengthF: 0.6 + rnd() * 0.55,
        shade: Math.min(5, Math.floor(Math.pow(rnd(), 1.4) * 6)),
        curl: (rnd() - 0.5) * 1.4,
        phase: rnd() * Math.PI * 2
      }));
    })();
    // Guides are an even spread of the beard strands; every other beard strand follows the
    // guide nearest to it on the jaw.
    const BEARD_GUIDE_STRANDS = (() => {
      const jaw = BEARD_STRANDS.filter(b => !b.moustache);
      const guides = Array.from({ length: BEARD_GUIDES }, (_, i) => jaw[Math.floor(i * jaw.length / BEARD_GUIDES)]);
      for (const b of jaw) {
        let best = 0, bd = Infinity;
        guides.forEach((g, i) => { const d = (g.t - b.t) ** 2 * 4 + (g.d - b.d) ** 2; if (d < bd) { bd = d; best = i; } });
        b.gi = best;
      }
      return guides;
    })();

    growBeard.addEventListener('click', () => {
      beard.target += BEARD_STEP;
      shaveBeard.hidden = false;
    });
    shaveBeard.addEventListener('click', () => {
      beard.target = 0;
      shaveBeard.hidden = true;
    });

    // A point partway along a polyline of landmarks, in 3D.
    function along(face, idx, f) {
      const u = Math.max(0, Math.min(1, f)) * (idx.length - 1), i = Math.min(idx.length - 2, Math.floor(u)), k = u - i;
      const a = face[idx[i]], b = face[idx[i + 1]];
      return v3(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k, a.z + (b.z - a.z) * k);
    }

    // Is (x, y) inside the polygon? pts is a flat [x0, y0, x1, y1, ...] array.
    function insidePolygon(pts, x, y) {
      let inside = false;
      for (let i = 0, j = pts.length - 2; i < pts.length; j = i, i += 2) {
        const xi = pts[i], yi = pts[i + 1], xj = pts[j], yj = pts[j + 1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }

    // Beard colour when their hair hasn't been measured: the darker pixels of brows and chin.
    function sampleBeardColours(t) {
      const w = video.videoWidth, h = video.videoHeight, k = 4;
      const s = beard.sampler, sw = Math.ceil(w / k), sh = Math.ceil(h / k);
      if (s.width !== sw || s.height !== sh) { s.width = sw; s.height = sh; }
      const ctx = s.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, sw, sh);
      const px = ctx.getImageData(0, 0, sw, sh).data;
      const colours = [];
      const take = (x, y) => {
        const mx = Math.round(x / k), my = Math.round(y / k);
        if (mx < 0 || my < 0 || mx >= sw || my >= sh) return;
        const i = (my * sw + mx) * 4, r = px[i], g = px[i + 1], b = px[i + 2];
        colours.push([0.3 * r + 0.59 * g + 0.11 * b, r, g, b]);
      };
      for (const b of t.m.brows) for (let f = 0; f <= 1; f += 0.05) take(b.ax + (b.bx - b.ax) * f, b.ay + (b.by - b.ay) * f);
      for (let f = 0.3; f <= 0.7; f += 0.02) for (let d = 0.2; d <= 0.6; d += 0.1) {
        const j = along(t.face, JAW, f), m = t.face[17];
        take(j.x + (m.x - j.x) * d, j.y + (m.y - j.y) * d);
      }
      colours.sort((p, q) => p[0] - q[0]);
      // The darkest samples are the hair; the rest is skin showing through.
      t.beardPalette = paletteFrom(colours.slice(0, Math.ceil(colours.length * 0.2)));
    }

    // Where a beard strand grows from, which way it grows and how long it is.
    function beardRoot(b, f, hf, mouth, lips) {
      const S = hf.S, down = scale3(hf.U, -1), lift = scale3(hf.F, 0.05 * S); // just in front of the skin
      if (b.moustache) {
        const l = along(f, UPPER_LIP, b.t), n = f[NOSE_BASE];
        const up = 0.1 + 0.55 * (b.d + 0.08) * Math.sin(Math.PI * b.t);
        return {
          root: add3(l, scale3(sub(n, l), up), lift),
          dir: norm(add3(down, scale3(hf.R, (b.t - 0.5) * 1.6), scale3(hf.F, 0.2))),
          // The moustache stays short and neat however long the beard gets.
          len: Math.min(beard.length, 0.18) * S * 0.5 * b.lengthF
        };
      }
      // How far from the jaw towards the mouth the beard reaches: a thin sideburn at the ears,
      // up to just under the lip at the chin.
      const reach = 0.1 + 0.62 * Math.pow(Math.sin(Math.PI * b.t), 1.5);
      const j = along(f, JAW, b.t), root = add3(j, scale3(sub(mouth, j), reach * b.d));
      if (insidePolygon(lips, root.x, root.y)) return null;
      // Down the face and a little forwards, drawing in towards the chin, the way a long
      // beard tapers rather than fanning out past the jaw.
      const chin = f[CHIN], inward = sub(chin, root);
      const inX = dot(inward, hf.R) / S;
      const dir = norm(add3(scale3(down, 0.9), scale3(hf.F, 0.28), scale3(hf.R, inX * 0.6)));
      // Sideburns and cheeks stay short; the length comes from the chin and jaw.
      const fromSide = Math.pow(Math.sin(Math.PI * b.t), 0.8);
      const shortCheeks = 1 - 0.6 * Math.max(0, b.d) * (1 - fromSide);
      const len = beard.length * S * b.lengthF * (0.18 + 0.82 * fromSide) * shortCheeks * (1 - 0.35 * Math.max(0, b.d));
      return { root: add3(root, lift), dir, len };
    }

    // Step the beard's guides: pinned at the root, pulled towards their natural shape (strongly
    // when short, barely when long), falling under gravity and kept from folding back into
    // the chin and neck.
    function simulateBeard(t, hf, roots, dt) {
      const S = hf.S, g = GRAVITY * S * dt * dt, damping = Math.exp(-dt * 4);
      const hold = Math.max(0.06, Math.min(0.85, 1 - beard.length / 0.45));
      if (!t.gfx.beardGuides) t.gfx.beardGuides = BEARD_GUIDE_STRANDS.map(() => ({ p: new Float32Array(BEARD_POINTS * 3), q: new Float32Array(BEARD_POINTS * 3), init: false, len: 0 }));
      const rest = new Float32Array(BEARD_POINTS * 3);
      const chinPt = t.face[CHIN];
      const jawHalf = Math.abs(dot(sub(t.face[JAW[0]], t.face[JAW[JAW.length - 1]]), hf.R)) / 2 * 0.92;
      BEARD_GUIDE_STRANDS.forEach((b, gi) => {
        const G = t.gfx.beardGuides[gi], r = roots.get(b);
        if (!r) { G.init = false; return; }
        const growing = G.init && r.len > G.len + 1e-6;
        G.len = r.len;
        const seg = r.len / BEARD_NODES, p = G.p, q = G.q;
        // Its natural shape: out along its direction, the tip drooping.
        for (let i = 0; i < BEARD_POINTS; i++) {
          const u = i / BEARD_NODES;
          rest[i * 3] = r.root.x + r.dir.x * r.len * u;
          rest[i * 3 + 1] = r.root.y + r.dir.y * r.len * u + r.len * 0.25 * u * u;
          rest[i * 3 + 2] = r.root.z + r.dir.z * r.len * u;
        }
        if (!G.init || Math.hypot(p[0] - r.root.x, p[1] - r.root.y) > S * 0.3) { p.set(rest); q.set(rest); G.init = true; }
        p[0] = q[0] = r.root.x; p[1] = q[1] = r.root.y; p[2] = q[2] = r.root.z;
        for (let i = 1; i < BEARD_POINTS; i++) {
          const k = i * 3;
          const vx = (p[k] - q[k]) * damping, vy = (p[k + 1] - q[k + 1]) * damping, vz = (p[k + 2] - q[k + 2]) * damping;
          q[k] = p[k]; q[k + 1] = p[k + 1]; q[k + 2] = p[k + 2];
          p[k] += vx; p[k + 1] += vy + g; p[k + 2] += vz;
        }
        const rootZ = dot(sub(r.root, hf.O), hf.F);
        for (let it = 0; it < 3; it++) {
          for (let i = 1; i < BEARD_POINTS; i++) {
            const k = i * 3, j = k - 3;
            // Towards its natural shape.
            p[k] += (rest[k] - p[k]) * hold; p[k + 1] += (rest[k + 1] - p[k + 1]) * hold; p[k + 2] += (rest[k + 2] - p[k + 2]) * hold;
            // Each segment its proper length.
            const ex = p[k] - p[j], ey = p[k + 1] - p[j + 1], ez = p[k + 2] - p[j + 2];
            const d = Math.hypot(ex, ey, ez) || 1, diff = (d - seg) / d;
            if (i === 1) { p[k] -= ex * diff; p[k + 1] -= ey * diff; p[k + 2] -= ez * diff; }
            else {
              p[k] -= ex * diff * 0.5; p[k + 1] -= ey * diff * 0.5; p[k + 2] -= ez * diff * 0.5;
              p[j] += ex * diff * 0.5; p[j + 1] += ey * diff * 0.5; p[j + 2] += ez * diff * 0.5;
            }
            // No wider than the jaw, narrowing towards the tip.
            const cx = (p[k] - chinPt.x) * hf.R.x + (p[k + 1] - chinPt.y) * hf.R.y + (p[k + 2] - chinPt.z) * hf.R.z;
            const limit = jawHalf * (1 - 0.3 * i / BEARD_NODES);
            if (Math.abs(cx) > limit) {
              const over = Math.abs(cx) - limit, sgn = Math.sign(cx);
              p[k] -= hf.R.x * over * sgn; p[k + 1] -= hf.R.y * over * sgn; p[k + 2] -= hf.R.z * over * sgn;
            }
            // Not back into the chin and neck.
            const lz = (p[k] - hf.O.x) * hf.F.x + (p[k + 1] - hf.O.y) * hf.F.y + (p[k + 2] - hf.O.z) * hf.F.z;
            if (lz < rootZ - 0.03 * S) {
              const push = rootZ - 0.03 * S - lz;
              p[k] += hf.F.x * push; p[k + 1] += hf.F.y * push; p[k + 2] += hf.F.z * push;
            }
          }
        }
        if (growing) for (let k = 3; k < BEARD_POINTS * 3; k++) q[k] = p[k] - (p[k] - q[k]) * 0.3;
      });
    }

    function drawBeard(t, hf, dt) {
      const G = t.gfx, mesh = G.beardMesh;
      mesh.visible = beard.length > 0.003 && t.fade > 0.5;
      if (!mesh.visible) return;
      const now = performance.now();
      if (!t.beardPalette || (t.beardSampledAt ?? 0) < now - 1000) { sampleBeardColours(t); t.beardSampledAt = now; }
      // Their own hair colour once it's been measured (beards usually match it), or the dye.
      const pal = beardPalette(t);
      const f = t.face, S = hf.S;
      const mouth = scale3(add3(f[13], f[14]), 0.5);
      const lips = new Float32Array(LIPS.flatMap(j => [f[j].x, f[j].y]));
      const roots = new Map();
      for (const b of BEARD_STRANDS) roots.set(b, beardRoot(b, f, hf, mouth, lips));
      simulateBeard(t, hf, roots, dt);

      const pos = mesh.geometry.attributes.position.array, col = mesh.geometry.attributes.color.array;
      const pts = new Float32Array(BEARD_POINTS * 3), shade = new Float32Array(BEARD_POINTS).fill(1);
      let drawn = 0;
      for (const b of BEARD_STRANDS) {
        const r = roots.get(b);
        if (!r || r.len < 0.5) continue;
        const guide = b.moustache ? null : G.beardGuides[b.gi], gr = guide && roots.get(BEARD_GUIDE_STRANDS[b.gi]);
        for (let k = 0; k < BEARD_POINTS; k++) {
          const u = k / BEARD_NODES;
          // A slight curl, growing towards the tip.
          const c = Math.sin(u * 3 + b.phase) * b.curl * r.len * 0.3;
          if (guide && guide.init && gr) {
            // Follow the guide's shape, from this strand's own root, for its own length.
            const ratio = Math.min(1, r.len / (gr.len || 1));
            const uu = k * ratio, i = Math.min(BEARD_NODES - 1, Math.floor(uu)), fr = uu - i, gk = i * 3;
            const keep = 1 - 0.5 * u;
            pts[k * 3] = guide.p[gk] + (guide.p[gk + 3] - guide.p[gk]) * fr + (r.root.x - gr.root.x) * keep - r.dir.y * c;
            pts[k * 3 + 1] = guide.p[gk + 1] + (guide.p[gk + 4] - guide.p[gk + 1]) * fr + (r.root.y - gr.root.y) * keep + r.dir.x * c;
            pts[k * 3 + 2] = guide.p[gk + 2] + (guide.p[gk + 5] - guide.p[gk + 2]) * fr + (r.root.z - gr.root.z) * keep;
          } else {
            pts[k * 3] = r.root.x + r.dir.x * r.len * u - r.dir.y * c;
            pts[k * 3 + 1] = r.root.y + r.dir.y * r.len * u + r.dir.x * c + r.len * 0.25 * u * u;
            pts[k * 3 + 2] = r.root.z + r.dir.z * r.len * u;
          }
        }
        writeRibbon(pos, col, drawn++, pts, BEARD_POINTS, Math.max(0.7, S * 0.0026), pal[b.shade], shade);
      }
      mesh.geometry.setDrawRange(0, drawn * BEARD_NODES * 6);
      mesh.geometry.attributes.position.needsUpdate = true;
      mesh.geometry.attributes.color.needsUpdate = true;
    }

    function renderHair(w, h, now, dt) {
      const cw = Math.round(w * HAIR_SCALE), ch = Math.round(h * HAIR_SCALE);
      if (hairCanvas.width !== cw || hairCanvas.height !== ch) renderer.setSize(cw, ch, false);
      hairUniforms.res.value.set(cw, ch);
      if (camera.right !== w || camera.bottom !== h) {
        camera.right = w; camera.bottom = h;
        camera.updateProjectionMatrix();
      }
      hair.length += (hair.target - hair.length) * 0.04;
      if (Math.abs(hair.target - hair.length) < 0.002) hair.length = hair.target;
      beard.length += (beard.target - beard.length) * 0.04;
      if (Math.abs(beard.target - beard.length) < 0.001) beard.length = beard.target;

      const people = tracks.filter(t => t.face);
      const count = Math.floor(STRANDS / Math.max(1, people.filter(t => t.hair.ready).length));
      for (const t of tracks) {
        if (t.face) updatePerson(t, count, dt, now / 1000);
        else if (t.gfx) t.gfx.group.visible = false;
      }
      renderer.render(scene, camera);
    }

    // ---------- Render loop ----------
    // Advanced by elapsed time rather than derived from it, so changing the speed doesn't jump.
    let waveClock = 0, lastNow = performance.now();
    const pulseData = new Float32Array(16 * 4);
    const browEnds = new Float32Array(8 * 4), browMid = new Float32Array(8 * 4);
    const browFace = new Float32Array(8 * 4), browSpan = new Float32Array(8);

    function render(now) {
      const w = video.videoWidth, h = video.videoHeight;
      if (w && h) {
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }

        const fresh = track(w, h);
        // Trace hair quickly until everyone's outline is known, then only now and then.
        const settled = hair.analyses > 4 && tracks.every(t => t.hair.ready);
        const every = settled ? (MOBILE ? 45 : 20) : 4;
        // Segment new frames while there's hair, so the occlusion mask matches what's on
        // screen: straight away whenever anyone moves, and at least every few frames when
        // everyone's still (then the last mask is still exact).
        if (fresh && hair.segmenter && (hair.target > 0 || hair.length > 0) && tracks.length) {
          const moved = tracks.some(t => {
            const h0 = t.segAt, hd = t.m.head;
            return !h0 || Math.hypot(hd.cx - h0.cx, hd.cy - h0.cy) > hd.size * 0.006 || Math.abs(hd.size - h0.size) > hd.size * 0.006;
          });
          const analyse = hair.frame % every === 0;
          if (moved || analyse || !settled || hair.sinceSeg >= (MOBILE ? 4 : 3)) {
            segmentFrame(w, h, analyse);
            hair.sinceSeg = 0;
            for (const t of tracks) t.segAt = { ...t.m.head };
          } else hair.sinceSeg++;
        }
        if (fresh) hair.frame++;

        const cycle = now / 1000 * Math.PI * 2 * Number(speed.value);
        // Grows up to (1 + amount) and shrinks down to 1 / (1 + amount).
        const scale = Math.pow(1 + Number(amount.value), Math.sin(cycle));
        // Sweep from just past one outer end to just past the other, then start again.
        // Wave speed is passes per second.
        waveClock = (waveClock + (now - lastNow) / 1000 * Number(waveSpeed.value)) % 1;

        pulseData.fill(0); browEnds.fill(0); browMid.fill(0); browFace.fill(0); browSpan.fill(1);
        tracks.slice(0, 4).forEach((t, f) => {
          const m = t.m;
          const regions = [[pulseEyes, m.eyes[0]], [pulseEyes, m.eyes[1]], [pulseNose, m.nose], [pulseMouth, m.mouth]];
          regions.forEach(([toggle, r], i) => {
            pulseData.set([r.x, r.y, toggle.checked ? r.r * t.fade : 0, 0], (f * 4 + i) * 4);
          });
          const [b0, b1] = m.brows;
          const cx = (b0.ax + b1.ax) / 2, cy = (b0.ay + b1.ay) / 2;
          const span = Math.hypot(b1.ax - b0.ax, b1.ay - b0.ay) / 2 || 1;
          // About 5% of the face height: a clear, cartoonish lift.
          const lift = browWobble.checked ? 0.05 * m.head.size * t.fade : 0;
          m.brows.forEach((b, i) => {
            const k = f * 2 + i;
            browEnds.set([b.ax, b.ay, b.bx, b.by], k * 4);
            browMid.set([b.mx, b.my, b.th, lift], k * 4);
            browFace.set([-m.head.ux, -m.head.uy, cx, cy], k * 4);
            browSpan[k] = span;
          });
        });

        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        gl.uniform2f(uniforms.res, w, h);
        gl.uniform1f(uniforms.scale, scale);
        gl.uniform4fv(uniforms.pulse, pulseData);
        gl.uniform4fv(uniforms.browEnds, browEnds);
        gl.uniform4fv(uniforms.browMid, browMid);
        gl.uniform4fv(uniforms.browFace, browFace);
        gl.uniform1fv(uniforms.browSpan, browSpan);
        gl.uniform1f(uniforms.waveAt, -1.5 + 3 * waveClock);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        updateMullet(now);
        renderHair(w, h, now, Math.min(0.05, Math.max(0, (now - lastNow) / 1000)));
        drawFlag(now);
      }
      lastNow = now;
      requestAnimationFrame(render);
    }

    // ---------- Camera ----------
    async function start() {
      status.hidden = false;
      retry.hidden = true;
      message.textContent = 'Requesting camera access…';

      if (!navigator.mediaDevices?.getUserMedia) {
        message.textContent = 'This browser does not support camera access. Open this page via http://localhost or https.';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: MOBILE
            ? { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } }
            : { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        status.hidden = true;
      } catch (err) {
        const reasons = {
          NotAllowedError: 'Camera permission was denied. Allow it in your browser (and in System Settings → Privacy & Security → Camera), then try again.',
          NotFoundError: 'No camera was found.',
          NotReadableError: 'The camera is in use by another app.'
        };
        message.textContent = reasons[err.name] || `Could not start the camera: ${err.message}`;
        retry.hidden = false;
        return;
      }

      if (!landmarker) {
        faceBadge.textContent = 'Loading face tracking…';
        faceBadge.hidden = false;
        try {
          landmarker = await createTask(FaceLandmarker, {
            baseOptions: { modelAssetPath: FACE_MODEL },
            runningMode: 'VIDEO',
            numFaces: MAX_FACES,
            outputFacialTransformationMatrixes: true
          });
          faceBadge.textContent = 'Looking for faces…';
        } catch (err) {
          faceBadge.textContent = `Face tracking failed to load: ${err.message}`;
        }
      }
    }

    retry.addEventListener('click', start);
    requestAnimationFrame(render);
    start();
  </script>
</body>
</html>
