<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Webcam Live</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; height: 100dvh; background: #000; color: #eee; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; overflow: hidden; }
    video { display: none; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
    #status { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
    #status[hidden] { display: none; }
    button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; cursor: pointer; }
    button:hover { background: #333; }
    button:disabled { opacity: .6; cursor: default; }
    #controls { position: fixed; z-index: 20; left: 16px; bottom: 16px; right: 16px; width: fit-content; max-width: calc(100% - 32px); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; padding: 10px 14px; border-radius: 10px; background: rgba(0,0,0,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 13px; }
    #controls span { opacity: .7; }
    #controls label { display: flex; align-items: center; gap: 8px; }
    #controls button { padding: 5px 12px; font-size: 13px; }
    #toggleControls { display: none; }
    #face { position: fixed; z-index: 20; top: max(16px, env(safe-area-inset-top)); left: 16px; font-size: 13px; padding: 4px 10px; border-radius: 6px; background: rgba(0,0,0,.55); }
    @media (max-width: 700px) {
      /* Fill the phone screen rather than letterboxing. */
      canvas { object-fit: cover; }
      #controls { left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); width: auto; max-width: none;
                  gap: 10px 16px; padding: 12px; font-size: 14px; }
      #controls input[type=checkbox] { width: 20px; height: 20px; margin: 0; }
      /* Sliders get a full row each so they're easy to drag. */
      #controls label:has(input[type=range]) { flex: 1 1 100%; }
      #controls input[type=range] { flex: 1; }
      #controls button { padding: 9px 14px; font-size: 14px; flex: 1; }
      #toggleControls { display: block; flex: 1 1 100%; }
      #controls.collapsed { gap: 0; padding: 6px; }
      #controls.collapsed > :not(#toggleControls) { display: none; }
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <canvas id="hairCanvas"></canvas>
  <div id="face" hidden>Looking for your face…</div>
  <div id="controls">
    <span>Pulse:</span>
    <label><input id="pulseEyes" type="checkbox"> Eyes</label>
    <label><input id="pulseNose" type="checkbox"> Nose</label>
    <label><input id="pulseMouth" type="checkbox"> Mouth</label>
    <label><input id="browWobble" type="checkbox"> Eyebrow wave</label>
    <label>Wave speed <input id="waveSpeed" type="range" min="0.05" max="1.5" step="0.05" value="0.35"></label>
    <label>Speed <input id="speed" type="range" min="0.2" max="4" step="0.1" value="1.2"></label>
    <label>Size <input id="amount" type="range" min="0" max="1" step="0.01" value="0.6"></label>
    <button id="growHair" type="button">Grow hair</button>
    <button id="resetHair" type="button" hidden>Reset hair</button>
    <button id="toggleControls" type="button">Hide controls</button>
  </div>
  <div id="status">
    <p id="message">Requesting camera access…</p>
    <button id="retry" hidden>Try again</button>
  </div>

  <script type="module">
    import { FaceLandmarker, ImageSegmenter, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

    const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm';
    const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
    // Segments each pixel into background, hair, body skin, face skin, clothes, other.
    const SEGMENT_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite';
    const HAIR_CATEGORY = 1;

    const $ = id => document.getElementById(id);
    const video = $('video'), canvas = $('canvas'), hairCanvas = $('hairCanvas');
    const status = $('status'), message = $('message'), retry = $('retry'), faceBadge = $('face');
    const speed = $('speed'), amount = $('amount');
    const pulseEyes = $('pulseEyes'), pulseNose = $('pulseNose'), pulseMouth = $('pulseMouth');
    const browWobble = $('browWobble'), waveSpeed = $('waveSpeed'), growHair = $('growHair'), resetHair = $('resetHair');

    // Phones get a lighter load: fewer hair strands and a smaller camera feed.
    const MOBILE = matchMedia('(max-width: 700px), (pointer: coarse)').matches;

    const controls = $('controls'), toggleControls = $('toggleControls');
    toggleControls.addEventListener('click', () => {
      const collapsed = controls.classList.toggle('collapsed');
      toggleControls.textContent = collapsed ? 'Show controls' : 'Hide controls';
    });

    // Browsers restore form state on reload; always start from the defaults in the HTML.
    for (const input of document.querySelectorAll('#controls input')) {
      input.checked = input.defaultChecked;
      input.value = input.defaultValue;
    }

    // Landmark indices from MediaPipe's 478-point face mesh.
    const EYES = [
      { centre: [468, 468], width: [33, 133], size: 1.1 },
      { centre: [473, 473], width: [362, 263], size: 1.1 }
    ];
    const NOSE = { centre: [1, 4], width: [129, 358], size: 1.0 };
    const MOUTH = { centre: [13, 14], width: [61, 291], size: 0.8 };
    // Each brow as [upper, lower] landmark pairs at its outer end, arch and inner end.
    const BROWS = [
      { outer: [70, 46], mid: [105, 52], inner: [107, 55] },
      { outer: [300, 276], mid: [334, 282], inner: [336, 285] }
    ];
    const FACE_OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377,
                       152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
    const FOREHEAD = 10, CHIN = 152;

    // ---------- WebGL: draw the video with the face warps ----------
    const gl = canvas.getContext('webgl', { premultipliedAlpha: false });

    const vertSrc = `
      attribute vec2 a;
      varying vec2 vUv;
      void main() {
        vUv = vec2(a.x * 0.5 + 0.5, 0.5 - a.y * 0.5); // top-left origin, same as landmarks
        gl_Position = vec4(a, 0.0, 1.0);
      }`;

    // All positions are in video pixels.
    const fragSrc = `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D tex;
      uniform vec2 res;
      uniform vec2 pulseCentre[4];   // eyes, nose, mouth
      uniform float pulseRadius[4];  // 0 = off
      uniform float scale;           // pulse: >1 enlarges, <1 shrinks
      uniform vec2 browOuter[2], browMid[2], browInner[2];
      uniform float browThick[2];    // half the brow's thickness
      uniform float browAmp;         // lift in pixels, 0 = off
      uniform vec2 faceRight, faceDown;
      uniform vec2 browCentre;       // between the brows
      uniform float browHalfSpan;    // centre to the outer end of a brow
      uniform float waveAt;          // where the wave is, -1 (one outer end) to 1 (the other)

      // Magnify or pinch around c, easing back to no change at radius r so there is no seam.
      vec2 pulse(vec2 p, vec2 c, float r) {
        vec2 d = p - c;
        float dist = length(d) / r;
        if (r <= 0.0 || dist >= 1.0) return p;
        return c + d * mix(1.0 / scale, 1.0, smoothstep(0.0, 1.0, dist));
      }

      // Lift the brows with a "Mexican wave" that travels from one brow across to the other:
      // whichever part of a brow the wave is passing lifts up, then settles as it moves on.
      // The brow's arch is modelled as a parabola through its ends and middle; the lift fades
      // out a few brow thicknesses away from it and past its ends, gently enough that the
      // image never folds.
      vec2 brow(vec2 p, vec2 a, vec2 m, vec2 b, float th, float amp) {
        if (amp <= 0.0 || th <= 0.0) return p;
        vec2 ab = b - a;
        float len = length(ab);
        float t = dot(p - a, ab) / (len * len);
        float along = smoothstep(-0.25, 0.05, t) * (1.0 - smoothstep(0.95, 1.25, t));
        if (along <= 0.0) return p;
        float arch = dot(m - (a + b) * 0.5, faceDown);
        float curveY = dot(a + ab * t - a, faceDown) + 4.0 * t * (1.0 - t) * arch;
        float y = dot(p - a, faceDown);
        // Fading over at least 2.2x the lift keeps the stretch gentle enough never to fold.
        float across = 1.0 - smoothstep(th, th + max(th * 6.0, amp * 2.2), abs(y - curveY));
        float pos = dot(p - browCentre, faceRight) / browHalfSpan;
        float lift = exp(-pow(pos - waveAt, 2.0) / 0.18);
        return p + faceDown * (amp * lift * along * across);
      }

      void main() {
        vec2 p = vUv * res;
        for (int i = 0; i < 4; i++) p = pulse(p, pulseCentre[i], pulseRadius[i]);
        for (int i = 0; i < 2; i++) p = brow(p, browOuter[i], browMid[i], browInner[i], browThick[i], browAmp);
        gl_FragColor = texture2D(tex, p / res);
      }`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const aLoc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(aLoc);
    gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    const uniforms = {};
    for (const name of ['res', 'scale', 'pulseCentre', 'pulseRadius', 'browOuter', 'browMid', 'browInner',
                        'browThick', 'browAmp', 'faceRight', 'faceDown', 'browCentre', 'browHalfSpan', 'waveAt']) {
      uniforms[name] = gl.getUniformLocation(prog, name);
    }

    // ---------- Face tracking ----------
    let landmarker = null;
    let lastVideoTime = -1;
    let face = null; // latest raw landmarks in video pixels, or null
    // Smoothed measurements in video pixels. fade goes to 0 when the face is lost.
    const eyes = EYES.map(() => ({ x: 0, y: 0, r: 0, fade: 0 }));
    const nose = { x: 0, y: 0, r: 0, fade: 0 };
    const mouth = { x: 0, y: 0, r: 0, fade: 0 };
    const brows = BROWS.map(() => ({ ax: 0, ay: 0, mx: 0, my: 0, bx: 0, by: 0, th: 0, fade: 0 }));
    // Head frame: centre, "up" unit vector and face height (forehead to chin).
    const head = { cx: 0, cy: 0, ux: 0, uy: -1, size: 0, fade: 0 };

    async function createTask(Task, options) {
      const fileset = await FilesetResolver.forVisionTasks(WASM);
      try {
        return await Task.createFromOptions(fileset, { ...options, baseOptions: { ...options.baseOptions, delegate: 'GPU' } });
      } catch {
        return await Task.createFromOptions(fileset, { ...options, baseOptions: { ...options.baseOptions, delegate: 'CPU' } });
      }
    }

    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

    function measureFeature(feature) {
      const c = mid(face[feature.centre[0]], face[feature.centre[1]]);
      const [e0, e1] = feature.width.map(j => face[j]);
      return { x: c.x, y: c.y, r: Math.hypot(e1.x - e0.x, e1.y - e0.y) * feature.size };
    }

    function measureBrow(b) {
      const [o, m, i] = [b.outer, b.mid, b.inner].map(([up, low]) => mid(face[up], face[low]));
      const th = Math.hypot(face[b.mid[0]].x - face[b.mid[1]].x, face[b.mid[0]].y - face[b.mid[1]].y) / 2;
      return { ax: o.x, ay: o.y, mx: m.x, my: m.y, bx: i.x, by: i.y, th };
    }

    function measureHead() {
      const top = face[FOREHEAD], chin = face[CHIN];
      const size = Math.hypot(top.x - chin.x, top.y - chin.y);
      return {
        // A little above the middle of the face, roughly the centre of the skull.
        cx: chin.x + (top.x - chin.x) * 0.62, cy: chin.y + (top.y - chin.y) * 0.62,
        ux: (top.x - chin.x) / size, uy: (top.y - chin.y) / size,
        size
      };
    }

    // Light smoothing to take the jitter out of the landmarks; fade out when the face is lost.
    function smooth(target, m) {
      if (!m) { target.fade *= 0.8; return; }
      const t = target.fade < 0.01 ? 1 : 0.5;
      for (const k in m) target[k] += (m[k] - target[k]) * t;
      target.fade += (1 - target.fade) * 0.3;
    }

    function track(w, h) {
      if (!landmarker || video.currentTime === lastVideoTime) return false;
      lastVideoTime = video.currentTime;

      const raw = landmarker.detectForVideo(video, performance.now()).faceLandmarks[0];
      face = raw ? raw.map(p => ({ x: p.x * w, y: p.y * h })) : null;
      faceBadge.hidden = !!face;

      EYES.forEach((eye, i) => smooth(eyes[i], face && measureFeature(eye)));
      BROWS.forEach((b, i) => smooth(brows[i], face && measureBrow(b)));
      smooth(nose, face && measureFeature(NOSE));
      smooth(mouth, face && measureFeature(MOUTH));
      smooth(head, face && measureHead());
      return true;
    }

    // ---------- Hair ----------
    // Strands grow from the outline of your real hair, found with MediaPipe's segmenter.
    // Everything is stored relative to the head (angle from "up", distance in face heights),
    // so the hair follows you as you move.
    const hairCtx = hairCanvas.getContext('2d');
    const BINS = 72;                 // directions around the head used to trace the hair outline
    const MAX_ANGLE = 1.95;          // radians either side of straight up (~112°)
    const STRAND_COUNT = MOBILE ? 2500 : 5000;
    const SEGMENTS = 14;
    const GROW_STEP = 0.3;           // face heights added per press

    const hair = {
      segmenter: null,
      loading: false,
      ready: false,                 // true once the outline has been traced at least once
      length: 0,                    // current length in face heights (animates towards target)
      target: 0,
      outline: new Float32Array(BINS).fill(0.62), // distance to the hair edge, in face heights
      palette: ['#2a1d15', '#3b2a1f', '#4d3727', '#614632', '#7a5a41', '#98755a'],
      frame: 0,
      sampler: document.createElement('canvas')
    };

    // Deterministic random numbers so the hairstyle stays the same between frames.
    function random(seed) {
      return () => {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // Strands are grouped into locks that share a direction, curl and sway, like real hair.
    const strands = (() => {
      const rnd = random(1234);
      const locks = Array.from({ length: 420 }, () => ({
        angle: (rnd() * 2 - 1) * MAX_ANGLE,
        curlAmp: 0.004 + rnd() * 0.018,
        curlFreq: 4 + rnd() * 9,
        phase: rnd() * Math.PI * 2,
        lengthF: 0.8 + rnd() * 0.35,
        stiffness: 0.7 + rnd() * 0.6
      }));
      return Array.from({ length: STRAND_COUNT }, () => {
        const lock = locks[Math.floor(rnd() * locks.length)];
        return {
          lock,
          angle: lock.angle + (rnd() - 0.5) * 0.09,
          inset: 0.8 + rnd() * 0.17,           // start a little inside the real hair so roots blend
          lengthF: lock.lengthF * (0.82 + rnd() * 0.3),
          spread: (rnd() - 0.5) * 0.02,
          shade: Math.min(5, Math.floor(Math.pow(rnd(), 1.3) * 6)),
          side: lock.angle === 0 ? 1 : Math.sign(lock.angle)
        };
      });
    })();

    async function loadSegmenter() {
      hair.loading = true;
      growHair.disabled = true;
      growHair.textContent = 'Loading hair…';
      try {
        hair.segmenter = await createTask(ImageSegmenter, {
          baseOptions: { modelAssetPath: SEGMENT_MODEL },
          runningMode: 'VIDEO',
          outputCategoryMask: true,
          outputConfidenceMasks: false
        });
      } catch (err) {
        faceBadge.textContent = `Hair model failed to load: ${err.message}`;
        faceBadge.hidden = false;
      }
      hair.loading = false;
      growHair.disabled = false;
      growHair.textContent = 'Grow hair';
    }

    growHair.addEventListener('click', async () => {
      if (!hair.segmenter && !hair.loading) await loadSegmenter();
      if (!hair.segmenter) return;
      hair.target += GROW_STEP;
      resetHair.hidden = false;
    });

    resetHair.addEventListener('click', () => {
      hair.target = 0;
      resetHair.hidden = true;
    });

    // Trace the hair outline around the head and pick up its colours.
    function analyseHair(w, h) {
      const result = hair.segmenter.segmentForVideo(video, performance.now());
      const mask = result.categoryMask;
      if (!mask) { result.close(); return; }
      const mw = mask.width, mh = mask.height;
      const cats = mask.getAsUint8Array();
      const isHair = (x, y) => {
        const mx = Math.round(x * mw / w), my = Math.round(y * mh / h);
        return mx >= 0 && my >= 0 && mx < mw && my < mh && cats[my * mw + mx] === HAIR_CATEGORY;
      };

      // March outwards from the centre of the head in each direction; the hair edge is the
      // last hair pixel before a clear run of non-hair.
      const S = head.size, rx = -head.uy, ry = head.ux;
      const traced = new Float32Array(BINS);
      for (let i = 0; i < BINS; i++) {
        const a = (i / (BINS - 1) * 2 - 1) * MAX_ANGLE;
        const dx = Math.cos(a) * head.ux + Math.sin(a) * rx;
        const dy = Math.cos(a) * head.uy + Math.sin(a) * ry;
        let edge = 0, misses = 0;
        for (let r = 0.3; r < 1.4; r += 0.012) {
          if (isHair(head.cx + dx * r * S, head.cy + dy * r * S)) { edge = r; misses = 0; }
          else if (edge && ++misses > 8) break;
        }
        // No hair found that way (bald patch, or the side of the face): grow from the head's edge.
        traced[i] = edge || (0.5 + 0.12 * Math.cos(a));
      }
      // Smooth the outline across neighbouring directions, then over time.
      for (let i = 0; i < BINS; i++) {
        let sum = 0, n = 0;
        for (let k = -2; k <= 2; k++) {
          const j = i + k;
          if (j >= 0 && j < BINS) { sum += traced[j]; n++; }
        }
        const v = sum / n;
        hair.outline[i] = hair.ready ? hair.outline[i] + (v - hair.outline[i]) * 0.35 : v;
      }

      // Sample the colours of your real hair every so often, from darkest to lightest.
      if (!hair.ready || hair.frame % 30 === 0) {
        const s = hair.sampler;
        s.width = mw; s.height = mh;
        const sctx = s.getContext('2d', { willReadFrequently: true });
        sctx.drawImage(video, 0, 0, mw, mh);
        const px = sctx.getImageData(0, 0, mw, mh).data;
        const colours = [];
        for (let i = mw + 1; i < cats.length - mw - 1; i += 2) {
          // Only pixels well inside the hair, so the background at its edge doesn't leak in.
          if (cats[i] !== HAIR_CATEGORY || cats[i - 1] !== HAIR_CATEGORY || cats[i + 1] !== HAIR_CATEGORY ||
              cats[i - mw] !== HAIR_CATEGORY || cats[i + mw] !== HAIR_CATEGORY) continue;
          const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2];
          colours.push([0.3 * r + 0.59 * g + 0.11 * b, r, g, b]);
        }
        if (colours.length > 200) {
          colours.sort((p, q) => p[0] - q[0]);
          // Biased towards the darker end: bright pixels are usually background showing through.
          hair.palette = [0.03, 0.1, 0.19, 0.3, 0.42, 0.6].map(q => {
            // Average a small band around each percentile to avoid noisy single pixels.
            const c = Math.floor(q * colours.length), band = Math.max(1, Math.floor(colours.length * 0.03));
            let r = 0, g = 0, b = 0, n = 0;
            for (let k = Math.max(0, c - band); k < Math.min(colours.length, c + band); k++, n++) {
              r += colours[k][1]; g += colours[k][2]; b += colours[k][3];
            }
            return `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;
          });
        }
      }

      result.close();
      hair.ready = true;
    }

    function outlineAt(angle) {
      const f = (angle / MAX_ANGLE + 1) / 2 * (BINS - 1);
      const i = Math.max(0, Math.min(BINS - 2, Math.floor(f)));
      const t = Math.max(0, Math.min(1, f - i));
      return hair.outline[i] * (1 - t) + hair.outline[i + 1] * t;
    }

    function drawHair(w, h, now) {
      if (hairCanvas.width !== w || hairCanvas.height !== h) {
        hairCanvas.width = w;
        hairCanvas.height = h;
      }
      hairCtx.clearRect(0, 0, w, h);
      hair.length += (hair.target - hair.length) * 0.06;
      if (hair.length < 0.005 || !hair.ready || !face || head.fade < 0.5) return;

      const S = head.size, ux = head.ux, uy = head.uy, rx = -uy, ry = ux;
      const time = now / 1000;
      const seg = hair.length * S / SEGMENTS;
      const width = Math.max(0.8, S * 0.0032);

      // Build one path per shade so thousands of strands draw in a handful of calls.
      const paths = hair.palette.map(() => new Path2D());
      const volume = new Path2D();

      strands.forEach((st, n) => {
        const L = st.lock;
        const a = st.angle;
        const ox = Math.cos(a) * ux + Math.sin(a) * rx, oy = Math.cos(a) * uy + Math.sin(a) * ry;
        const r0 = outlineAt(a) * st.inset;
        let x = head.cx + ox * r0 * S, y = head.cy + oy * r0 * S;
        // Start lying along the scalp, running away from the crown towards the strand's side,
        // with a little lift outwards for volume.
        const tx = (-Math.sin(a) * ux + Math.cos(a) * rx) * st.side;
        const ty = (-Math.sin(a) * uy + Math.cos(a) * ry) * st.side;
        let dx = tx * 0.85 + ox * 0.3 + st.spread, dy = ty * 0.85 + oy * 0.3;
        const path = paths[st.shade];
        path.moveTo(x, y);
        if (n % 5 === 0) volume.moveTo(x, y);
        let px = x, py = y;

        for (let k = 1; k <= SEGMENTS; k++) {
          const s = k / SEGMENTS;
          // Gravity pulls strands down the screen; stiffer locks hold their shape longer.
          // Scaled by segment length so long hair falls the same way short hair does.
          dy += Math.min(3, 0.55 * seg / (0.07 * S)) / L.stiffness;
          // Keep hair draping around the head rather than falling through it.
          const hx = ((x - head.cx) * rx + (y - head.cy) * ry) / S;
          const hy = ((x - head.cx) * ux + (y - head.cy) * uy) / S;
          const inside = (hx / 0.52) ** 2 + (hy / 0.66) ** 2;
          if (inside < 1.15 && hy > -0.9) {
            const push = (1.15 - inside) * 1.4;
            dx += (hx * rx + hy * ux) * push;
            dy += (hx * ry + hy * uy) * push;
          }
          const dl = Math.hypot(dx, dy) || 1;
          dx /= dl; dy /= dl;
          x += dx * seg * st.lengthF;
          y += dy * seg * st.lengthF;

          // Curl and a gentle sway, both growing towards the tips.
          const curl = Math.sin(s * L.curlFreq + L.phase) * L.curlAmp * S * s;
          const sway = Math.sin(time * 1.1 + L.phase) * 0.012 * S * s * s * hair.length;
          const qx = x - dy * (curl + sway), qy = y + dx * (curl + sway);
          path.quadraticCurveTo(px, py, (px + qx) / 2, (py + qy) / 2);
          if (n % 5 === 0) volume.quadraticCurveTo(px, py, (px + qx) / 2, (py + qy) / 2);
          px = qx; py = qy;
        }
        path.lineTo(px, py);
        if (n % 5 === 0) volume.lineTo(px, py);
      });

      hairCtx.lineCap = 'round';
      hairCtx.lineJoin = 'round';
      // A soft, darker underlayer gives the hair body so it isn't see-through.
      hairCtx.globalAlpha = 0.5;
      hairCtx.strokeStyle = hair.palette[0];
      hairCtx.lineWidth = width * 5;
      hairCtx.stroke(volume);
      // Then the individual strands, darkest first so highlights sit on top.
      hairCtx.globalAlpha = 0.85;
      hairCtx.lineWidth = width;
      paths.forEach((p, i) => {
        hairCtx.strokeStyle = hair.palette[i];
        hairCtx.lineWidth = i === 5 ? width * 0.7 : width;
        hairCtx.stroke(p);
      });
      hairCtx.globalAlpha = 1;

      // Tuck the hair behind the face.
      hairCtx.globalCompositeOperation = 'destination-out';
      hairCtx.filter = `blur(${Math.max(1, S * 0.006)}px)`;
      hairCtx.beginPath();
      FACE_OVAL.forEach((j, i) => i ? hairCtx.lineTo(face[j].x, face[j].y) : hairCtx.moveTo(face[j].x, face[j].y));
      hairCtx.closePath();
      hairCtx.fill();
      hairCtx.filter = 'none';
      hairCtx.globalCompositeOperation = 'source-over';
    }

    // ---------- Render loop ----------
    // Advanced by elapsed time rather than derived from it, so changing the speed doesn't jump.
    let waveClock = 0, lastNow = performance.now();

    function render(now) {
      const w = video.videoWidth, h = video.videoHeight;
      if (w && h) {
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }

        const fresh = track(w, h);
        if (fresh && hair.segmenter && hair.target > 0 && face && hair.frame++ % (MOBILE ? 10 : 6) === 0) analyseHair(w, h);

        const cycle = now / 1000 * Math.PI * 2 * Number(speed.value);
        // Grows up to (1 + amount) and shrinks down to 1 / (1 + amount).
        const scale = Math.pow(1 + Number(amount.value), Math.sin(cycle));
        const pulseR = (on, f) => on ? f.r * f.fade : 0;

        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        gl.uniform2f(uniforms.res, w, h);
        gl.uniform1f(uniforms.scale, scale);
        gl.uniform2fv(uniforms.pulseCentre, new Float32Array([eyes[0].x, eyes[0].y, eyes[1].x, eyes[1].y, nose.x, nose.y, mouth.x, mouth.y]));
        gl.uniform1fv(uniforms.pulseRadius, new Float32Array([
          pulseR(pulseEyes.checked, eyes[0]),
          pulseR(pulseEyes.checked, eyes[1]),
          pulseR(pulseNose.checked, nose),
          pulseR(pulseMouth.checked, mouth)
        ]));

        const b = brows;
        gl.uniform2fv(uniforms.browOuter, new Float32Array([b[0].ax, b[0].ay, b[1].ax, b[1].ay]));
        gl.uniform2fv(uniforms.browMid, new Float32Array([b[0].mx, b[0].my, b[1].mx, b[1].my]));
        gl.uniform2fv(uniforms.browInner, new Float32Array([b[0].bx, b[0].by, b[1].bx, b[1].by]));
        gl.uniform1fv(uniforms.browThick, new Float32Array([b[0].th, b[1].th]));
        // About 5% of the face height: a clear, cartoonish lift.
        gl.uniform1f(uniforms.browAmp, browWobble.checked ? 0.05 * head.size * Math.min(b[0].fade, b[1].fade) : 0);
        gl.uniform2f(uniforms.faceRight, -head.uy, head.ux);
        gl.uniform2f(uniforms.faceDown, -head.ux, -head.uy);
        gl.uniform2f(uniforms.browCentre, (b[0].ax + b[1].ax) / 2, (b[0].ay + b[1].ay) / 2);
        gl.uniform1f(uniforms.browHalfSpan, Math.hypot(b[1].ax - b[0].ax, b[1].ay - b[0].ay) / 2 || 1);
        // Sweep from just past one outer end to just past the other, then start again.
        // Wave speed is passes per second.
        waveClock = (waveClock + (now - lastNow) / 1000 * Number(waveSpeed.value)) % 1;
        gl.uniform1f(uniforms.waveAt, -1.5 + 3 * waveClock);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        drawHair(w, h, now);
      }
      lastNow = now;
      requestAnimationFrame(render);
    }

    // ---------- Camera ----------
    async function start() {
      status.hidden = false;
      retry.hidden = true;
      message.textContent = 'Requesting camera access…';

      if (!navigator.mediaDevices?.getUserMedia) {
        message.textContent = 'This browser does not support camera access. Open this page via http://localhost or https.';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: MOBILE
            ? { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
            : { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        status.hidden = true;
      } catch (err) {
        const reasons = {
          NotAllowedError: 'Camera permission was denied. Allow it in your browser (and in System Settings → Privacy & Security → Camera), then try again.',
          NotFoundError: 'No camera was found.',
          NotReadableError: 'The camera is in use by another app.'
        };
        message.textContent = reasons[err.name] || `Could not start the camera: ${err.message}`;
        retry.hidden = false;
        return;
      }

      if (!landmarker) {
        faceBadge.textContent = 'Loading face tracking…';
        faceBadge.hidden = false;
        try {
          landmarker = await createTask(FaceLandmarker, {
            baseOptions: { modelAssetPath: FACE_MODEL },
            runningMode: 'VIDEO',
            numFaces: 1
          });
          faceBadge.textContent = 'Looking for your face…';
        } catch (err) {
          faceBadge.textContent = `Face tracking failed to load: ${err.message}`;
        }
      }
    }

    retry.addEventListener('click', start);
    requestAnimationFrame(render);
    start();
  </script>
</body>
</html>
